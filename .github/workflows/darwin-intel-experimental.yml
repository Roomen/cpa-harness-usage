name: Experimental Darwin Intel (single Go plugin only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: macos-15-intel
    defaults:
      run:
        shell: bash
    steps:
      - name: Explain experimental limitation
        run: |
          echo "::warning::Single-Go-plugin experiment only. The patched TLS slot collides with other Go plugins using the same slot. Coexistence is unsupported; this artifact is not a supported store release."

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          architecture: x64
          cache: npm

      - uses: ./.github/actions/setup-go-cache
        id: go-cache
        with:
          profile: experimental-darwin-intel
          compiler-key: ${{ hashFiles('scripts/darwin-amd64-go.sh') }}

      - uses: actions/cache@v5
        with:
          path: .cache/tlsgo
          key: tlsgo-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.go-version }}-${{ hashFiles('scripts/darwin-amd64-go.sh') }}

      - name: Prepare patched Go toolchain
        run: |
          goroot=$(bash scripts/darwin-amd64-go.sh)
          echo "PLUGIN_GO=$goroot/bin/go" >> "$GITHUB_ENV"

      - name: Prepare pinned collector
        env:
          GOOS: darwin
          GOARCH: amd64
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/prepare-collector.mjs

      - name: Verify real collector with synthetic fixtures
        run: go test -tags 'bundledcollector collectorintegration' ./internal/usage

      - name: Build experimental plugin
        env:
          CGO_ENABLED: "1"
          GOOS: darwin
          GOARCH: amd64
          MACOSX_DEPLOYMENT_TARGET: "12.0"
          CGO_CFLAGS: "-O2 -g -mmacosx-version-min=12.0"
          CGO_LDFLAGS: "-mmacosx-version-min=12.0"
        run: |
          mkdir -p out
          export GOROOT="${PLUGIN_GO%/bin/go}" GOTOOLCHAIN=local
          export CC="clang -arch x86_64"
          "$PLUGIN_GO" build -tags bundledcollector -trimpath -buildmode=c-shared -o out/harness-usage-experimental-single-go-plugin.dylib ./cmd/plugin
          rm -f out/*.h

      - name: Load single plugin from stock Go host
        run: |
          go build -o out/fakeccusage ./internal/usage/testdata/fakeccusage
          go run ./cmd/plugin-smoke -library out/harness-usage-experimental-single-go-plugin.dylib -binary out/fakeccusage
          go run ./cmd/plugin-smoke -library out/harness-usage-experimental-single-go-plugin.dylib -binary bundled

      - uses: actions/upload-artifact@v6
        with:
          name: experimental-darwin-amd64-single-go-plugin-only
          path: out/harness-usage-experimental-single-go-plugin.dylib
          if-no-files-found: error

      - uses: actions/cache/save@v5
        if: always() && steps.go-cache.outputs.build-cache-path != '' && steps.go-cache.outputs.build-cache-hit != 'true'
        with:
          path: ${{ steps.go-cache.outputs.build-cache-path }}
          key: ${{ steps.go-cache.outputs.build-cache-key }}
