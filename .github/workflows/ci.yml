name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    # Documentation and screenshot changes cannot alter the binaries, and a
    # release falls back to building when its commit has no CI artifacts.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE*"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE*"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: vet and race tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-go-cache
        id: go-cache
        with:
          profile: test

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      - uses: actions/cache/save@v5
        if: always() && steps.go-cache.outputs.build-cache-path != '' && steps.go-cache.outputs.build-cache-hit != 'true'
        with:
          path: ${{ steps.go-cache.outputs.build-cache-path }}
          key: ${{ steps.go-cache.outputs.build-cache-key }}

  # This matrix is the only place a library is compiled, and it runs once per
  # change: pull requests only run the tests above, the push that lands the
  # change on main compiles all five targets, and a release tag on that same
  # commit promotes these artifacts instead of rebuilding them.
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: arm64, runner: macos-14, ext: dylib }
          - { goos: linux, goarch: amd64, runner: ubuntu-24.04, ext: so }
          - { goos: linux, goarch: arm64, runner: ubuntu-24.04-arm, ext: so }
          - { goos: windows, goarch: amd64, runner: windows-2025, ext: dll }
          - { goos: windows, goarch: arm64, runner: windows-11-arm, ext: dll }
    uses: ./.github/workflows/build-target.yml
    with:
      goos: ${{ matrix.goos }}
      goarch: ${{ matrix.goarch }}
      runner: ${{ matrix.runner }}
      ext: ${{ matrix.ext }}
