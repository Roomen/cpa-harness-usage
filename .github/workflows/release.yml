name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without leading v (builds artifacts only; push a vX.Y.Z tag to publish)"
        required: false

permissions:
  contents: write

env:
  PLUGIN_ID: harness-usage
  # Go 1.26's own floor. Left unset, the runner SDK version becomes the minimum macOS.
  MACOS_MIN: "12.0"

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go vet ./...
      - run: go test -race ./...

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: arm64, runner: macos-14, ext: dylib }
          - { goos: linux, goarch: amd64, runner: ubuntu-latest, ext: so }
          - { goos: linux, goarch: arm64, runner: ubuntu-24.04-arm, ext: so }
          - { goos: windows, goarch: amd64, runner: windows-latest, ext: dll }
        # darwin/amd64 is intentionally absent: stock Go shared libraries hit
        # the known TLS collision inside a Go host. See README.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            v="${{ github.event.inputs.version }}"
          else
            v="0.0.0-dev"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build plugin library
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.goos == 'windows' && 'gcc' || '' }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p out
          if [ "$GOOS" = darwin ]; then
            export MACOSX_DEPLOYMENT_TARGET="$MACOS_MIN"
            export CGO_CFLAGS="-O2 -g -mmacosx-version-min=$MACOS_MIN"
            export CGO_LDFLAGS="-mmacosx-version-min=$MACOS_MIN"
          fi
          go build -trimpath \
            -ldflags "-s -w \
              -X cpa-harness-usage/internal/plugin.Version=${VERSION} \
              -X cpa-harness-usage/internal/plugin.Repository=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -buildmode=c-shared -o "out/${PLUGIN_ID}.${{ matrix.ext }}" ./cmd/plugin
          rm -f out/*.h
          test -s "out/${PLUGIN_ID}.${{ matrix.ext }}"
          ls -l out

      - name: Package
        run: |
          version="${{ steps.ver.outputs.version }}"
          zipname="${PLUGIN_ID}_${version}_${{ matrix.goos }}_${{ matrix.goarch }}.zip"
          mkdir -p dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path 'out/${PLUGIN_ID}.${{ matrix.ext }}' -DestinationPath 'dist/${zipname}' -Force"
          else
            (cd out && zip -q "../dist/${zipname}" "${PLUGIN_ID}.${{ matrix.ext }}")
          fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Write checksums
        working-directory: dist
        run: |
          sha256sum *.zip > checksums.txt
          cat checksums.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.zip dist/checksums.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            || gh release upload "${GITHUB_REF_NAME}" dist/*.zip dist/checksums.txt \
              --repo "${GITHUB_REPOSITORY}" --clobber
