name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without leading v (builds artifacts only; push a vX.Y.Z tag to publish)"
        required: false
      rebuild:
        description: "Ignore CI artifacts and rebuild every target"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

env:
  PLUGIN_ID: harness-usage
  # Go 1.26's own floor. Left unset, the runner SDK version becomes the minimum macOS.
  MACOS_MIN: "12.0"

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
      run_id: ${{ steps.reuse.outputs.run_id }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.version }}" ]; then
            v="${{ inputs.version }}"
          else
            v="0.0.0-dev"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Require the declared version to match
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # The library embeds internal/plugin.Version from source, so a
          # promoted CI artifact is only correct when source and tag agree.
          if [ "$VERSION" = "0.0.0-dev" ]; then
            exit 0
          fi
          if ! grep -q "Version = \"$VERSION\"" internal/plugin/plugin.go; then
            echo "internal/plugin/plugin.go does not declare Version = \"$VERSION\"." >&2
            echo "Bump it (and package.json) before tagging." >&2
            exit 1
          fi

      - name: Find reusable CI artifacts
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          REBUILD: ${{ inputs.rebuild }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          echo "run_id=" >> "$GITHUB_OUTPUT"
          if [ "$REBUILD" = "true" ] || [ "$VERSION" = "0.0.0-dev" ]; then
            echo "rebuild requested; compiling every target." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          run_id=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=success&per_page=1" \
            --jq '.workflow_runs[0].id // empty')
          if [ -z "$run_id" ]; then
            echo "no successful CI run for ${GITHUB_SHA}; compiling every target." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name | startswith("build-"))] | length')
          if [ "$count" -ne 5 ]; then
            echo "CI run ${run_id} has ${count} build artifacts; compiling every target." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "reusing build artifacts from CI run ${run_id}; no compilation." >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: verify
    needs: prepare
    if: needs.prepare.outputs.run_id == ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-go-cache
        id: go-cache
        with:
          profile: test

      - run: go vet ./...
      - run: go test -race ./...

      - uses: actions/cache/save@v5
        if: always() && steps.go-cache.outputs.build-cache-path != '' && steps.go-cache.outputs.build-cache-hit != 'true'
        with:
          path: ${{ steps.go-cache.outputs.build-cache-path }}
          key: ${{ steps.go-cache.outputs.build-cache-key }}

  # Fallback only: a commit without reusable CI artifacts. The normal tag path
  # skips this job entirely.
  build:
    name: build
    needs: [prepare, verify]
    if: needs.prepare.outputs.run_id == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: arm64, runner: macos-14, ext: dylib }
          - { goos: linux, goarch: amd64, runner: ubuntu-24.04, ext: so }
          - { goos: linux, goarch: arm64, runner: ubuntu-24.04-arm, ext: so }
          - { goos: windows, goarch: amd64, runner: windows-2025, ext: dll }
          - { goos: windows, goarch: arm64, runner: windows-11-arm, ext: dll }
    uses: ./.github/workflows/build-target.yml
    with:
      goos: ${{ matrix.goos }}
      goarch: ${{ matrix.goarch }}
      runner: ${{ matrix.runner }}
      ext: ${{ matrix.ext }}

  package:
    name: package
    needs: [prepare, build]
    if: always() && needs.prepare.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - name: Download CI artifacts
        if: needs.prepare.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ needs.prepare.outputs.run_id }}
        run: gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'build-*' --dir artifacts

      - uses: actions/download-artifact@v7
        if: needs.prepare.outputs.run_id == ''
        with:
          pattern: build-*
          path: artifacts

      - name: Package libraries
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          for dir in artifacts/build-*/; do
            dir="${dir%/}"
            name=$(basename "$dir")
            goos=${name#build-}
            goos=${goos%%-*}
            goarch=${name##*-}
            library=""
            for ext in so dylib dll; do
              if [ -f "$dir/${PLUGIN_ID}.${ext}" ]; then
                library="${PLUGIN_ID}.${ext}"
                break
              fi
            done
            if [ -z "$library" ]; then
              echo "no plugin library in ${dir}" >&2
              exit 1
            fi
            (cd "$dir" && zip -q -X "$GITHUB_WORKSPACE/dist/${PLUGIN_ID}_${VERSION}_${goos}_${goarch}.zip" "$library")
          done
          count=$(find dist -name '*.zip' | wc -l | tr -d ' ')
          if [ "$count" -ne 5 ]; then
            echo "packaged ${count} libraries, expected 5" >&2
            exit 1
          fi
          (cd dist && sha256sum *.zip > checksums.txt && cat checksums.txt)

      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  release:
    name: publish release
    needs: package
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.zip dist/checksums.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            || gh release upload "${GITHUB_REF_NAME}" dist/*.zip dist/checksums.txt \
              --repo "${GITHUB_REPOSITORY}" --clobber
