name: Build target

# One native target build, shared by CI and the manual release fallback so both
# produce identical artifacts with a single definition.
on:
  workflow_call:
    inputs:
      goos:
        type: string
        required: true
      goarch:
        type: string
        required: true
      runner:
        type: string
        required: true
      ext:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: build ${{ inputs.goos }}/${{ inputs.goarch }}
    runs-on: ${{ inputs.runner }}
    env:
      MACOS_MIN: "12.0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          architecture: ${{ inputs.goarch == 'amd64' && 'x64' || 'arm64' }}
          cache: npm

      - uses: ./.github/actions/setup-go-cache
        id: go-cache
        with:
          profile: build
          compiler-key: ${{ hashFiles('.github/scripts/setup-*-toolchain.*', '.github/workflows/ci.yml', '.github/workflows/release.yml', '.github/workflows/build-target.yml', 'scripts/darwin-amd64-go.patch.json') }}

      - uses: actions/cache/restore@v5
        id: tlsgo-cache
        if: inputs.goos == 'darwin' && inputs.goarch == 'amd64'
        with:
          # The cache version is derived from this path list, so it stays exactly
          # `.cache/tlsgo`: any other path would stop the prefix below from
          # matching the v0.1.5 cache, which is the one this change migrates.
          path: .cache/tlsgo
          # The toolchain identity is the Go version, the runner architecture and
          # the patch data, so maintaining the build script no longer discards a
          # cached toolchain. The prefix also reaches the v0.1.5 key
          # (tlsgo-macOS-X64-1.26.10-11a45c63b596765a4efc7ee244e89883e97f0b02c03db189ebb4d115720faef6);
          # the script copies that one toolchain to the new identity and ignores
          # anything else it finds there.
          key: tlsgo-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.go-version }}-${{ hashFiles('scripts/darwin-amd64-go.patch.json') }}
          restore-keys: |
            tlsgo-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.go-version }}-

      # The cache identity and the lock protocol have synthetic tests that mock
      # curl/tar/go, so they compile nothing; they run before the real toolchain
      # work so a cache regression fails the build instead of silently rebuilding.
      - name: Check the toolchain cache and lock protocol
        if: inputs.goos == 'darwin' && inputs.goarch == 'amd64'
        run: python3 scripts/test-darwin-amd64-go-lock.py

      - name: Prepare patched Go toolchain (darwin/amd64)
        if: inputs.goos == 'darwin' && inputs.goarch == 'amd64'
        run: |
          goroot=$(bash scripts/darwin-amd64-go.sh)
          echo "PLUGIN_GO=$goroot/bin/go" >> "$GITHUB_ENV"

      # Saved explicitly, right after the toolchain is verified: the script only
      # publishes a complete entry, so the cache survives a later plugin build
      # failure, while a failed prepare never reaches these steps and caches
      # nothing. Run state is dropped first, because a cancelled build leaves
      # .build.*/.migrate.* behind and this workspace belongs to this job alone.
      - name: Drop toolchain run state
        if: inputs.goos == 'darwin' && inputs.goarch == 'amd64' && steps.tlsgo-cache.outputs.cache-hit != 'true'
        run: rm -rf .cache/tlsgo/.build.* .cache/tlsgo/.migrate.*

      - uses: actions/cache/save@v5
        if: inputs.goos == 'darwin' && inputs.goarch == 'amd64' && steps.tlsgo-cache.outputs.cache-hit != 'true'
        with:
          path: .cache/tlsgo
          key: tlsgo-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.go-version }}-${{ hashFiles('scripts/darwin-amd64-go.patch.json') }}

      - uses: actions/cache@v5
        if: inputs.goos == 'windows'
        with:
          path: .tools
          key: llvm-mingw-20261006-${{ inputs.goos }}-${{ inputs.goarch }}-${{ hashFiles('.github/scripts/setup-windows-toolchain.ps1') }}

      - uses: actions/cache@v5
        if: inputs.goos == 'linux'
        with:
          path: .tools
          key: zig-0.15.2-${{ inputs.goos }}-${{ inputs.goarch }}-${{ hashFiles('.github/scripts/setup-linux-toolchain.sh') }}

      - uses: actions/cache/restore@v5
        if: inputs.goos == 'linux'
        id: zig-cache
        with:
          path: .cache/zig-build-${{ inputs.goarch }}
          key: zig-build-v1-0.15.2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.goarch }}-${{ hashFiles('.github/scripts/setup-linux-toolchain.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: zig-build-v1-0.15.2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.goarch }}-${{ hashFiles('.github/scripts/setup-linux-toolchain.sh') }}-

      - name: Set up pinned Linux C compiler
        if: inputs.goos == 'linux'
        env:
          GOARCH: ${{ inputs.goarch }}
        run: bash .github/scripts/setup-linux-toolchain.sh

      - name: Set up pinned Windows C compiler
        if: inputs.goos == 'windows'
        shell: pwsh
        env:
          GOARCH: ${{ inputs.goarch }}
        run: .github/scripts/setup-windows-toolchain.ps1

      - name: Prepare pinned collector
        env:
          GOOS: ${{ inputs.goos }}
          GOARCH: ${{ inputs.goarch }}
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node scripts/prepare-collector.mjs

      - name: Verify real collector with synthetic fixtures
        run: go test -tags 'bundledcollector collectorintegration' ./internal/usage

      - name: Build plugin library
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ inputs.goos }}
          GOARCH: ${{ inputs.goarch }}
        run: |
          mkdir -p out
          GO_CMD="go"
          if [ -n "${PLUGIN_GO:-}" ]; then
            export GOROOT="${PLUGIN_GO%/bin/go}" GOTOOLCHAIN=local
            GO_CMD="$PLUGIN_GO"
          fi
          if [ -n "${PLUGIN_CC:-}" ]; then
            export CC="$PLUGIN_CC" ZIG_GLOBAL_CACHE_DIR="$PLUGIN_ZIG_GLOBAL_CACHE_DIR"
          fi
          if [ "${{ inputs.goos }}" = "darwin" ]; then
            export MACOSX_DEPLOYMENT_TARGET="$MACOS_MIN"
            export CGO_CFLAGS="-O2 -g -mmacosx-version-min=$MACOS_MIN"
            export CGO_LDFLAGS="-mmacosx-version-min=$MACOS_MIN"
            if [ "${{ inputs.goarch }}" = "amd64" ]; then
              export CC="clang -arch x86_64"
            fi
          fi
          # Release builds used to add these flags; keeping them here means a
          # promoted CI artifact is the same binary a tag build would produce.
          "$GO_CMD" build -tags bundledcollector -trimpath \
            -ldflags "-s -w -X cpa-harness-usage/internal/plugin.Repository=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -buildmode=c-shared -o "out/harness-usage.${{ inputs.ext }}" ./cmd/plugin
          rm -f out/*.h
          test -s "out/harness-usage.${{ inputs.ext }}"
          ls -l out

      - name: Check Linux GLIBC baseline
        if: inputs.goos == 'linux'
        run: bash .github/scripts/check-glibc.sh out/harness-usage.so

      - name: Check Darwin library
        if: inputs.goos == 'darwin'
        run: bash scripts/check-darwin.sh "out/harness-usage.dylib" "${{ inputs.goarch }}" "$MACOS_MIN"

      - name: Build CLI
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ inputs.goos }}
          GOARCH: ${{ inputs.goarch }}
        run: go build -tags bundledcollector -trimpath -o out/harness-usage${{ inputs.goos == 'windows' && '.exe' || '' }} ./cmd/harness-usage

      - name: Load plugin from Go host
        run: |
          go build -o out/fakeccusage${{ inputs.goos == 'windows' && '.exe' || '' }} ./internal/usage/testdata/fakeccusage
          go run ./cmd/plugin-smoke -library out/harness-usage.${{ inputs.ext }} -binary out/fakeccusage${{ inputs.goos == 'windows' && '.exe' || '' }}
          go run ./cmd/plugin-smoke -library out/harness-usage.${{ inputs.ext }} -binary bundled

      - uses: actions/upload-artifact@v6
        with:
          name: build-${{ inputs.goos }}-${{ inputs.goarch }}
          path: |
            out/harness-usage.${{ inputs.ext }}
            out/harness-usage${{ inputs.goos == 'windows' && '.exe' || '' }}
          if-no-files-found: error

      - uses: actions/cache/save@v5
        if: always() && steps.go-cache.outputs.build-cache-path != '' && steps.go-cache.outputs.build-cache-hit != 'true'
        with:
          path: ${{ steps.go-cache.outputs.build-cache-path }}
          key: ${{ steps.go-cache.outputs.build-cache-key }}

      - uses: actions/cache/save@v5
        if: always() && inputs.goos == 'linux' && steps.zig-cache.outputs.cache-primary-key != '' && steps.zig-cache.outputs.cache-hit != 'true'
        with:
          path: .cache/zig-build-${{ inputs.goarch }}
          key: ${{ steps.zig-cache.outputs.cache-primary-key }}
