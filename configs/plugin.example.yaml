# Example CLIProxyAPI configuration for the Harness Usage plugin.
#
# Copy the library to <plugins.dir>/<goos>/<goarch>/harness-usage.<ext>,
# then merge this block into the CPA configuration file.
plugins:
  enabled: true
  dir: plugins
  configs:
    harness-usage:
      enabled: true
      priority: 0
      # Embedded native collector; no Node.js/npm required on the CPA host.
      # Override with an absolute native executable path if needed.
      binary: bundled
      # Any subset of claude, codex, opencode. Omit for all three.
      sources: [claude, codex, opencode]
