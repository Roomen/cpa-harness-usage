<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Harness Usage</title>
<style>
/* Layout: sticky toolbar → account quota → local usage summary → chart | ranking → details.
   Quota and local token counters live in separate bands and are never summed. */
:root {
  --bg: #f3f5f8; --surface: #ffffff; --surface-2: #eef1f5; --fg: #141b24; --muted: #5b6878; --faint: #8a96a5; --line: #dfe4ea;
  --accent: #2b62d9; --accent-soft: #e6edfc; --ok: #138a55; --warn: #b7740a; --crit: #c4311f;
  --ok-soft: #e3f4ec; --warn-soft: #fbf0dc; --crit-soft: #fbe6e3;
  --c1: #2b62d9; --c2: #0f9a72; --c3: #d9850a; --c4: #8455e8; --c5: #d64d6a; --c6: #0e93ad; --c7: #6b7a8c;
  --in: #2b62d9; --out: #0f9a72; --cr: #9fb4d9; --cw: #8455e8; --oth: #b7c0cb;
  --radius: 14px;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]):not([data-theme="white"]) {
  --bg: #0e1319; --surface: #151c24; --surface-2: #1c2530; --fg: #e6ecf3; --muted: #9aa8b7; --faint: #6f7d8c; --line: #26313d;
  --accent: #7ea6ff; --accent-soft: #1b2a42; --ok: #4fd08f; --warn: #f2b84b; --crit: #ff7d6b;
  --ok-soft: #14301f; --warn-soft: #33270f; --crit-soft: #3a1b18;
  --c1: #7ea6ff; --c2: #3fcf9f; --c3: #f2b84b; --c4: #b79bff; --c5: #ff8aa3; --c6: #3cc9e4; --c7: #8a99aa;
  --in: #7ea6ff; --out: #3fcf9f; --cr: #3f5272; --cw: #b79bff; --oth: #4a5868; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0e1319; --surface: #151c24; --surface-2: #1c2530; --fg: #e6ecf3; --muted: #9aa8b7; --faint: #6f7d8c; --line: #26313d;
  --accent: #7ea6ff; --accent-soft: #1b2a42; --ok: #4fd08f; --warn: #f2b84b; --crit: #ff7d6b;
  --ok-soft: #14301f; --warn-soft: #33270f; --crit-soft: #3a1b18;
  --c1: #7ea6ff; --c2: #3fcf9f; --c3: #f2b84b; --c4: #b79bff; --c5: #ff8aa3; --c6: #3cc9e4; --c7: #8a99aa;
  --in: #7ea6ff; --out: #3fcf9f; --cr: #3f5272; --cw: #b79bff; --oth: #4a5868; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { max-width: 100%; overflow-x: hidden; }
html { background: var(--bg); }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--sans); -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

.pricing-controls { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; margin-bottom: 16px; }
.pricing-controls .note { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.pricing-controls .pricing-error { color: var(--danger, var(--fg)); }

/* toolbar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.bar-in, .page { max-width: 1440px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.bar-in { display: flex; align-items: center; gap: 12px; min-height: 56px; padding-block: 8px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; margin-right: auto; }
.brand h1 { margin: 0; font-size: 17px; letter-spacing: -.01em; white-space: nowrap; }
.brand span { color: var(--faint); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tools { display: contents; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 9px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 5px 11px; border-radius: 7px; color: var(--muted); font-size: 13px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / .12); font-weight: 600; }
.seg button.custom-on { color: var(--accent); }
.ctl { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 11px; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; font-size: 13px; white-space: nowrap; }
.ctl:hover { border-color: var(--accent); }
.ctl:disabled { opacity: .55; cursor: progress; }
.ctl .k { color: var(--faint); }
.ctl select { border: 0; background: transparent; padding: 0; }
.icon-btn { width: 34px; padding: 0; justify-content: center; }
.dd { position: relative; }
.menu { position: absolute; right: 0; top: calc(100% + 6px); width: 270px; max-height: 70vh; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 32px rgb(0 0 0 / .16); padding: 6px; z-index: 6; }
.menu label, .sheet .srcs label { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 8px; font-size: 13px; }
.menu label:hover { background: var(--surface-2); }
.menu .r, .sheet .srcs .r { margin-left: auto; color: var(--faint); font-size: 12px; white-space: nowrap; }
.r.fail { color: var(--crit); }
.menu-act { display: flex; gap: 6px; justify-content: flex-end; padding: 4px 4px 2px; border-top: 1px solid var(--line); margin-top: 4px; }
.linkish { border: 0; background: none; color: var(--accent); font-size: 12px; padding: 3px 6px; border-radius: 6px; }
.linkish:hover { background: var(--accent-soft); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.only-narrow { display: none; }

.page { padding-block: 20px 48px; display: grid; gap: 20px; }
.page > section { min-width: 0; }
.band-h { display: flex; align-items: baseline; gap: 10px; margin: 0 0 10px; flex-wrap: wrap; }
.band-h h2 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.band-h .note { color: var(--faint); font-size: 12px; }
.band-h .right { margin-left: auto; font-size: 12px; color: var(--faint); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; }

/* auth + notices */
.auth { max-width: 470px; margin: 56px auto; padding: 30px; }
.auth h2 { margin: 0 0 8px; font-size: 19px; }
.auth p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label { font-size: 12px; font-weight: 600; color: var(--muted); }
.field input { width: 100%; min-width: 0; min-height: 42px; padding: 8px 11px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.auth-row { display: flex; gap: 10px; margin-top: 14px; }
.btn-p { background: var(--accent); color: var(--surface); border: 0; border-radius: 8px; padding: 6px 14px; font-size: 13px; font-weight: 600; }
.auth-row .btn-p { flex: 1; min-height: 40px; font-size: 14px; }
.auth-error { margin-top: 12px; color: var(--crit); font-size: 13px; }
.notice { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; padding: 12px 15px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.notice[data-kind="error"] { border-color: var(--crit); background: var(--crit-soft); }
.notice[data-kind="warning"] { border-color: var(--warn); background: var(--warn-soft); }
.notice .message { flex: 1 1 240px; min-width: 0; }
.notice .detail { color: var(--muted); font-size: 12px; margin-top: 2px; }
.spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.skeleton { display: grid; gap: 12px; }
.skeleton .sk { height: 76px; border-radius: 12px; background: var(--surface-2); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .55; } }
.empty { padding: 40px 20px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--fg); margin-bottom: 6px; font-size: 15px; }

/* quota */
.quota { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); grid-auto-flow: row dense; gap: 12px; }
.qcard { padding: 16px; display: grid; gap: 14px; container-type: inline-size; align-content: start; }
.qcard.local { grid-column: span 2; }
.qhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.qhead strong { font-size: 15px; }
.qcard.poolc .qhead strong { font-size: 14px; }
.plan { font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.also { font-size: 11px; padding: 1px 7px; border-radius: 99px; border: 1px dashed var(--line); color: var(--muted); white-space: nowrap; }
.src { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--faint); white-space: nowrap; }
.src i { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
.src.stale i { background: var(--warn); }
.wins { display: grid; gap: 12px; }
@container (min-width: 460px) { .wins { grid-template-columns: 1fr 1fr; gap: 18px; } }
.wins.one { grid-template-columns: 1fr !important; }
.win { display: grid; gap: 6px; }
.win-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.win-top .lbl { font-size: 12px; color: var(--muted); }
.win-top .big { font-size: 22px; font-weight: 650; letter-spacing: -.02em; }
.win-top .big small { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 3px; }
.win-top .reset { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
.meter { position: relative; height: 8px; border-radius: 99px; background: var(--surface-2); }
.meter b { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: var(--ok); }
.meter b.warn { background: var(--warn); }
.meter b.crit { background: var(--crit); }
.meter.unknown { background: repeating-linear-gradient(135deg, var(--line) 0 5px, transparent 5px 10px); }
.win-top .big.unknown { color: var(--muted); }
.meter .pace { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--fg); opacity: .55; border-radius: 1px; }
.pace-txt { font-size: 12px; color: var(--faint); }
.pace-txt.ahead { color: var(--warn); }
.qerr { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: var(--warn-soft); color: var(--fg); font-size: 13px; }
.qerr b { color: var(--warn); }
.qhint { font-size: 12px; color: var(--faint); }
.pool-toggle { text-align: left; font: inherit; color: inherit; cursor: pointer; }
.pool-toggle:hover { border-color: var(--accent); }
.pool-toggle.open { background: var(--surface-2); }
.pool-mini { display: flex; gap: 6px; flex-wrap: wrap; }
.pool-act { font-size: 12px; color: var(--accent); }
.pool-note { font-size: 12px; color: var(--faint); }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.crit { background: var(--crit-soft); color: var(--crit); }
.quota-msg { padding: 14px 16px; font-size: 13px; color: var(--muted); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; grid-column: 1 / -1; }

/* summary */
.sum { padding: 18px; display: grid; grid-template-columns: auto auto 1fr; gap: 28px; align-items: center; }
.kpi .l { font-size: 12px; color: var(--muted); }
.kpi .v { font-size: 30px; font-weight: 650; letter-spacing: -.025em; line-height: 1.15; }
.kpi .s { font-size: 12px; color: var(--faint); }
.comp { display: grid; gap: 10px; min-width: 0; }
.stack { display: flex; height: 12px; border-radius: 99px; overflow: hidden; background: var(--surface-2); }
.stack span { height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12px; color: var(--muted); }
.legend b { color: var(--fg); font-weight: 600; margin-left: 4px; }
.legend .item { display: inline-flex; align-items: center; gap: 6px; }

/* chart + ranking */
.split { display: grid; grid-template-columns: minmax(0, 2fr) minmax(300px, 1fr); gap: 12px; }
.pad { padding: 16px 18px; }
.ph { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.ph h3 { margin: 0; font-size: 15px; }
.ph .meta { margin-left: auto; font-size: 12px; color: var(--faint); }
.ph .seg.gran { margin-left: auto; }
.chart-panel { display: flex; flex-direction: column; }
.chart-box { flex: 1; min-height: 240px; position: relative; }
#chart { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#chart text { fill: var(--faint); font-size: 11px; font-family: var(--sans); }
#chart .grid { stroke: var(--line); }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.stat .l { font-size: 12px; color: var(--muted); }
.stat .v { font-size: 17px; font-weight: 650; letter-spacing: -.01em; }
.stat .s { font-size: 11px; color: var(--faint); }
.up { color: var(--warn); } .down { color: var(--ok); }
.gran button:disabled { opacity: .35; cursor: default; }
.tip { position: fixed; pointer-events: none; background: var(--fg); color: var(--bg); font-size: 12px; padding: 8px 10px; border-radius: 8px; z-index: 9; min-width: 150px; max-width: 280px; }
.tip div { display: flex; gap: 10px; } .tip div span:last-child { margin-left: auto; }
.rank { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.rank li { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 8px 6px; border-radius: 8px; }
.rank li:hover { background: var(--surface-2); }
.rank .name { font-size: 13px; font-weight: 550; overflow-wrap: anywhere; cursor: pointer; }
.rank .val { font-size: 13px; text-align: right; }
.rank .sub { grid-column: 2 / 4; display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--faint); min-width: 0; }
.rank .sub .srcs { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.rank .track { flex: 1; min-width: 30px; height: 4px; border-radius: 99px; background: var(--surface-2); }
.rank .track b { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
.rank input { margin: 0; accent-color: var(--accent); }
.rank-more { margin-top: 6px; width: 100%; justify-content: center; }
.foot { margin: 12px 0 0; font-size: 12px; color: var(--faint); }

/* details */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th.n, td.n { text-align: right; }
td.model { max-width: 280px; overflow: hidden; text-overflow: ellipsis; }
tr.day td { background: var(--surface-2); font-weight: 600; cursor: pointer; }
tr.day td:first-child { border-radius: 8px 0 0 8px; } tr.day td:last-child { border-radius: 0 8px 8px 0; }
td .srcname { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.dash { color: var(--faint); }
.cards { display: none; }
.more { display: flex; justify-content: center; margin-top: 12px; }

@media (max-width: 1100px) {
  .split { grid-template-columns: 1fr; }
  .chart-box { flex: none; height: 280px; }
  .sum { grid-template-columns: auto auto; }
  .comp { grid-column: 1 / -1; }
}
@media (max-width: 960px) {
  .brand span, .wide-only { display: none !important; }
  .only-narrow { display: inline-flex; }
}
@media (max-width: 720px) {
  .bar-in, .page { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .sum { grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px; }
  .kpi .v { font-size: 24px; }
  .tbl-wrap { display: none; }
  .cards { display: grid; gap: 8px; }
  .dcard { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; }
  .dcard .t { display: flex; gap: 8px; align-items: center; font-size: 13px; min-width: 0; }
  .dcard .t .m { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .dcard .t b { margin-left: auto; }
  .dcard .g { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; font-size: 12px; color: var(--muted); }
  .dcard .g span b { display: block; color: var(--fg); font-weight: 500; }
  .dhead { font-size: 12px; font-weight: 600; color: var(--muted); margin-top: 6px; border: 0; background: none; padding: 0; text-align: left; }
  .chart-box { height: 210px; min-height: 0; }
  .stats { grid-template-columns: 1fr 1fr; }
  .auth { margin: 18px auto; padding: 21px; }
}
@media (max-width: 560px) {
  .quota { grid-template-columns: 1fr; }
  .qcard.local { grid-column: auto; }
}
/* filter sheet */
.sheet-bg { position: fixed; inset: 0; background: rgb(0 0 0 / .35); z-index: 20; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--surface); border-radius: 16px 16px 0 0; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; max-height: 80vh; overflow: auto; }
.sheet h4 { margin: 0; font-size: 13px; color: var(--muted); font-weight: 600; }
.sheet .seg { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); }
.sheet .srcs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.sheet .srcs label { border: 1px solid var(--line); border-radius: 9px; }
.sheet-custom { display: grid; gap: 8px; }
/* time range */
.range-wrap { position: relative; }
.pop { position: absolute; top: calc(100% + 6px); left: 0; z-index: 6; width: 300px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 32px rgb(0 0 0 / .16); padding: 12px; display: grid; gap: 10px; }
.row2 { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 6px; align-items: center; }
.row2 input { width: 100%; min-width: 0; height: 34px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 0 8px; font-size: 13px; }
.quick { display: flex; flex-wrap: wrap; gap: 6px; }
.quick button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 3px 10px; font-size: 12px; color: var(--muted); }
.quick button:hover { border-color: var(--accent); color: var(--fg); }
.pop .act { display: flex; gap: 8px; justify-content: flex-end; }
.err-txt { color: var(--crit); font-size: 12px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } .spinner { animation-duration: 2.4s; } }
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <div class="brand"><h1 data-i18n="appTitle">Harness Usage</h1><span data-i18n="subtitle"></span></div>
    <div class="tools" id="top-actions" hidden>
      <div class="range-wrap wide-only">
        <div class="seg" id="range" role="group"></div>
        <div class="pop" id="custom-pop" hidden>
          <div class="quick" id="quick"></div>
          <div class="row2"><input type="date" id="from" data-i18n-label="from"><span>–</span><input type="date" id="to" data-i18n-label="to"></div>
          <div class="err-txt" id="range-err" hidden></div>
          <div class="act"><button class="ctl" type="button" id="custom-cancel" data-i18n="cancel"></button><button class="btn-p" type="button" id="custom-apply" data-i18n="apply"></button></div>
        </div>
      </div>
      <div class="dd wide-only">
        <button class="ctl" type="button" id="src-btn" aria-haspopup="true" aria-expanded="false"><span class="k" data-i18n="source"></span> <span id="src-lbl" class="num"></span> ▾</button>
        <div class="menu" id="src-menu" hidden></div>
      </div>
      <button class="ctl only-narrow" type="button" id="filter-btn"><span data-i18n="filters"></span> · <span id="filter-lbl"></span></button>
      <label class="ctl wide-only"><span class="k" data-i18n="autoRefresh"></span>

  const el = (id) => document.getElementById(id);

  // DOM writes only happen when the rendered output changes, so refreshes
  // with an unchanged snapshot cause zero DOM mutations.
  function setHTML(node, html) {
    if (node.__html !== html) { node.innerHTML = html; node.__html = html; }
  }
  function setText(node, text) { if (node.textContent !== text) node.textContent = text; }
  function setHidden(node, hidden) { if (node.hidden !== hidden) node.hidden = hidden; }
  function setAttr(node, name, value) { if (node.getAttribute(name) !== value) node.setAttribute(name, value); }

  function detectLanguage() {
    const candidates = [];
    try {
      const raw = localStorage.getItem(STORAGE_LANGUAGE);
      if (raw) {
        let parsed = null;
        try { parsed = JSON.parse(raw); } catch (e) { parsed = raw; }
        const value = parsed && typeof parsed === "object" ? (parsed.state && parsed.state.language) || parsed.language : parsed;
        if (typeof value === "string") candidates.push(value);
      }
    } catch (e) { /* storage unavailable */ }
    if (navigator.languages) candidates.push.apply(candidates, navigator.languages);
    candidates.push(navigator.language || "");
    for (const candidate of candidates) {
      const lower = String(candidate).toLowerCase();
      if (lower.startsWith("zh-tw") || lower.startsWith("zh-hk") || lower.startsWith("zh-mo") || lower.startsWith("zh-hant")) return "zh-TW";
      if (lower.startsWith("zh")) return "zh-CN";
      if (lower.startsWith("ru")) return "ru";
      if (lower.startsWith("vi")) return "vi";
      if (lower.startsWith("ko")) return "ko";
      if (lower.startsWith("en")) return "en";
    }
    return "en";
  }

  function t(key, vars) {
    const pack = STRINGS[state.language] || STRINGS.en;
    let value = pack[key] || STRINGS.en[key] || key;
    if (vars) Object.keys(vars).forEach((name) => { value = value.split("{" + name + "}").join(String(vars[name])); });
    return value;
  }

  function applyLanguage() {
    state.language = detectLanguage();
    document.documentElement.lang = state.language;
    document.querySelectorAll("[data-i18n]").forEach((node) => setText(node, t(node.dataset.i18n)));
    document.querySelectorAll("[data-i18n-label]").forEach((node) => setAttr(node, "aria-label", t(node.dataset.i18nLabel)));
    document.querySelectorAll("[data-i18n-title]").forEach((node) => { setAttr(node, "title", t(node.dataset.i18nTitle)); setAttr(node, "aria-label", t(node.dataset.i18nTitle)); });

  // Read the management center's saved key when this page runs on the same
  // origin. The value is only kept in memory here; this page never writes it.
  function readSavedKey() {
    try {
      let raw = localStorage.getItem(STORAGE_AUTH);
      if (!raw) return "";
      if (raw.indexOf(OBFUSCATION_PREFIX) === 0) {
        const keyBytes = new TextEncoder().encode(OBFUSCATION_SALT + "|" + location.host + "|" + navigator.userAgent);
        const binary = atob(raw.slice(OBFUSCATION_PREFIX.length));
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i) ^ keyBytes[i % keyBytes.length];
        raw = new TextDecoder().decode(bytes);
      }
      const parsed = JSON.parse(raw);
      const value = parsed && parsed.state ? parsed.state.managementKey : parsed && parsed.managementKey;
      return typeof value === "string" ? value : "";
    } catch (e) {
      return "";
    }
  }

  function applyTheme() {
    let theme = "auto";
    try {
      const raw = localStorage.getItem(STORAGE_THEME);
      if (raw) {
        let parsed = null;
        try { parsed = JSON.parse(raw); } catch (e) { parsed = raw; }
        const value = parsed && typeof parsed === "object" ? (parsed.state && parsed.state.theme) || parsed.theme : parsed;
        if (typeof value === "string") theme = value;
      }
    } catch (e) { /* storage unavailable */ }
    const root = document.documentElement;
    if (theme === "dark") root.setAttribute("data-theme", "dark");
    else if (theme === "light" || theme === "white") root.setAttribute("data-theme", "light");
    else root.removeAttribute("data-theme");
  }

  function esc(value) {
    return String(value).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  }

  function formatTokens(value) {
    const n = Number(value) || 0;
    if (n < 1000) return String(Math.round(n));
    for (const [size, suffix] of [[1e9, "B"], [1e6, "M"], [1e3, "K"]]) {
      if (n >= size) {
        const scaled = n / size;
        return (scaled >= 100 ? scaled.toFixed(0) : scaled >= 10 ? scaled.toFixed(1) : scaled.toFixed(2)) + suffix;
      }
    }
    return String(n);
  }
  function formatExact(value) { return (Number(value) || 0).toLocaleString(state.language); }
  function formatCost(value) {
    if (value === null || value === undefined) return "—";
    const n = Number(value) || 0;
    if (n === 0) return "$0.00";
    if (n < 0.01) return "<$0.01";
    if (n < 100) return "$" + n.toFixed(2);
    return "$" + n.toFixed(0);
  }
  function costHTML(value) { return value === null || value === undefined ? '<span class="dash">—</span>' : esc(formatCost(value)); }

  // ---------- dates (local calendar days, YYYY-MM-DD) ----------
  const pad2 = (n) => String(n).padStart(2, "0");
  const keyOf = (d) => d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  const parseKey = (k) => { const p = k.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); };
  const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
  const diffDays = (a, b) => Math.round((parseKey(b) - parseKey(a)) / DAY);
  const today = () => keyOf(new Date());
  const short = (k) => k.slice(5).replace("-", "/");
  const isDateKey = (v) => typeof v === "string" && /^\d{4}-\d{2}-\d{2}$/.test(v);

  function firstDate() {
    let first = "";
    if (state.report && Array.isArray(state.report.sources)) {
      state.report.sources.forEach((source) => (Array.isArray(source.daily) ? source.daily : []).forEach((row) => {
        if (row && isDateKey(row.date) && (!first || row.date < first)) first = row.date;
      }));
    }
    const now = today();
    return first && first < now ? first : now;
  }

  function span() {
    const now = today();
    switch (state.range) {
      case "today": return [now, now];
      case "all": return [firstDate(), now];
      case "custom": return [state.from, state.to];
      default: return [addDays(now, 1 - Number(state.range)), now];
    }
  }

  function rangeLabel() {
    const [f, to] = span();
    if (state.range === "today") return t("rangeToday");
    if (state.range === "all") return t("labelAll");
    if (state.range === "custom") return f === to ? f : short(f) + " – " + short(to);
    return t("labelLast", { n: state.range });
  }

  function autoGran(n) { return n <= 45 ? "day" : n <= 200 ? "week" : "month"; }
  function granAllowed(g, n) { return g === "day" ? n <= 120 : g === "week" ? n >= 14 && n <= 730 : n >= 60; }
  function effGran() { const [f, to] = span(), n = diffDays(f, to) + 1; return state.gran && granAllowed(state.gran, n) ? state.gran : autoGran(n); }
  function bucketStart(k, g) {
    if (g === "day") return k;
    if (g === "month") return k.slice(0, 8) + "01";
    const d = parseKey(k); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return keyOf(d); // ISO week, Monday start
  }
  function bucketEnd(start, g) {
    if (g === "day") return start;
    if (g === "week") return addDays(start, 6);
    const d = parseKey(start); d.setMonth(d.getMonth() + 1); d.setDate(0); return keyOf(d);
  }

  function sourceLabel(source) { return SOURCE_LABELS[source] || source; }

  function errorLabel(code) {
    const map = { timeout: "errorTimeout", command_failed: "errorCommandFailed", unknown_schema: "errorUnknownSchema", output_too_large: "errorOutputTooLarge", canceled: "errorCanceled", unsupported_source: "errorUnsupported" };
    return t(map[code] || "errorGeneric");
  }

  function sourceStatus() {
    const bySource = {};
    if (state.report && Array.isArray(state.report.sources)) {
      state.report.sources.forEach((item) => { if (item && typeof item.source === "string") bySource[item.source] = item; });
    }
    return bySource;
  }

  // Sources and models are preselected from the first report, then the user's
  // choices win. New entries appear selected so no data is hidden silently.
  function reconcileSelection() {
    const statuses = sourceStatus();
    if (!state.sourcesTouched) state.sources = new Set(Object.keys(statuses).filter((source) => statuses[source].status === "ok"));
    const models = collectModels();
    if (!state.modelsTouched) {
      state.models = new Set(models);
      state.knownModels = new Set(models);
      return;
    }
    const known = new Set(models);
    const knownBefore = state.knownModels || new Set();
    const next = new Set(Array.from(state.models).filter((model) => known.has(model)));
    models.forEach((model) => { if (!knownBefore.has(model)) next.add(model); });
    state.models = next;
    state.knownModels = known;
  }

  function collectModels() {
    const [f, to] = span();
    const names = new Set();
    buildEntries(f, to).forEach((entry) => { if (entry.model) names.add(entry.model); });
    return Array.from(names);
  }

  function selectedSources() {
    const statuses = sourceStatus();
    return Object.keys(statuses).filter((source) => state.sources.has(source) && statuses[source].status !== "error");
  }

  // Build (date, source, model) entries between two dates. A day's reported
  // total is authoritative: unattributed tokens become an "unattributed"
  // entry instead of being dropped or redistributed.
  function buildEntries(from, to) {
    const entries = [];
    if (!state.report || !Array.isArray(state.report.sources)) return entries;
    const wanted = new Set(selectedSources());
    state.report.sources.forEach((source) => {
      if (!wanted.has(source.source)) return;
      (Array.isArray(source.daily) ? source.daily : []).forEach((row) => {
        if (!row || !isDateKey(row.date) || row.date < from || row.date > to) return;
        const base = {
          date: row.date, source: source.source,
          input: Number(row.inputTokens) || 0, output: Number(row.outputTokens) || 0,
          cacheRead: Number(row.cacheReadTokens) || 0, cacheWrite: Number(row.cacheCreationTokens) || 0,
          total: Number(row.totalTokens) || 0,
          cost: row.missingPricing === true || typeof row.costUSD !== "number" ? null : row.costUSD
        };
        const models = (Array.isArray(row.models) ? row.models : []).filter((model) => model && typeof model.model === "string");
        if (!models.length) { entries.push(Object.assign({}, base, { model: "" })); return; }
        const known = { input: 0, output: 0, cacheRead: 0, cacheWrite: 0, total: 0, cost: 0 };
        let costComplete = true;
        models.forEach((model) => {
          const cost = model.missingPricing === true || typeof model.costUSD !== "number" ? null : model.costUSD;
          if (cost === null) costComplete = false;
          const entry = {
            date: row.date, source: source.source, model: model.model,
            input: Number(model.inputTokens) || 0, output: Number(model.outputTokens) || 0,
            cacheRead: Number(model.cacheReadTokens) || 0, cacheWrite: Number(model.cacheCreationTokens) || 0,
            total: Number(model.totalTokens) || 0, cost: cost
          };
          entries.push(entry);
          ["input", "output", "cacheRead", "cacheWrite", "total"].forEach((k) => { known[k] += entry[k]; });
          if (cost !== null) known.cost += cost;
        });
        const rest = {};
        ["input", "output", "cacheRead", "cacheWrite", "total"].forEach((k) => { rest[k] = Math.max(0, base[k] - known[k]); });
        const costRest = costComplete && base.cost !== null ? Math.max(0, base.cost - known.cost) : null;
        if (rest.total > 0 || rest.input || rest.output || rest.cacheRead || rest.cacheWrite || (costRest || 0) > 1e-9) {
          entries.push(Object.assign({ date: row.date, source: source.source, model: "", cost: costRest }, rest));
        }
      });
    });
    return entries;
  }

  function modelSelected(model) { return !state.modelsTouched || state.models.has(model); }
  function filteredEntries(from, to) { return buildEntries(from, to).filter((entry) => entry.model === "" || modelSelected(entry.model)); }
  function allModelsSelected() { return !state.modelsTouched || state.models.size >= collectModels().length; }

  function totalsOf(entries) {
    return entries.reduce((acc, e) => {
      acc.input += e.input; acc.output += e.output; acc.cacheRead += e.cacheRead; acc.cacheWrite += e.cacheWrite; acc.total += e.total;
      if (e.cost !== null) acc.cost += e.cost; else acc.costUnknown += 1;
      return acc;
    }, { input: 0, output: 0, cacheRead: 0, cacheWrite: 0, total: 0, cost: 0, costUnknown: 0 });
  }

  // With every model selected the reported day cost is authoritative; with a
  // model subset only per-model costs can be summed.
  function costFor(entries, from, to) {
    if (allModelsSelected()) {
      let sum = 0;
      let unknown = false;
      const wanted = new Set(selectedSources());
      state.report.sources.forEach((source) => {
        if (!wanted.has(source.source)) return;
        (Array.isArray(source.daily) ? source.daily : []).forEach((row) => {
          if (!row || !isDateKey(row.date) || row.date < from || row.date > to) return;
          if (row.missingPricing === true || typeof row.costUSD !== "number") unknown = true;
          else sum += row.costUSD;
        });
      });
      return unknown ? null : sum;
    }
    const totals = totalsOf(entries);
    return totals.costUnknown ? null : totals.cost;
  }

  function hasAnyData() {
    return buildEntries("0000-00-00", "9999-99-99").length > 0;
  }

  // ---------- toolbar ----------
  const RANGES = [["today", "rangeToday"], ["7", "range7"], ["30", "range30"], ["90", "range90"], ["all", "rangeAll"], ["custom", "rangeCustom"]];
  function renderRangeButtons() {
    const html = RANGES.map(([r, key]) => '<button type="button" data-r="' + r + '">' + esc(t(key)) + "</button>").join("");
    setHTML(el("range"), html);
    setHTML(el("range2"), html);
  }

    document.querySelectorAll("#range button, #range2 button").forEach((b) => setAttr(b, "aria-pressed", String(b.dataset.r === state.range)));
    const custom = el("range").querySelector('[data-r="custom"]');
    if (custom) {
      setText(custom, state.range === "custom" ? rangeLabel() : t("rangeCustom"));
      custom.classList.toggle("custom-on", state.range === "custom");
    }
    setText(el("filter-lbl"), rangeLabel());
  }

  function renderSources() {
    const statuses = sourceStatus();
    const listed = Object.keys(statuses);
    const item = (source) => {

      return '<label><input type="checkbox" data-s="' + esc(source) + '"' + (state.sources.has(source) && !failed ? " checked" : "") + (failed ? " disabled" : "") + '><span class="dot" style="background:' + (SOURCE_COLORS[source] || "var(--c7)") + '"></span>' + esc(sourceLabel(source)) + flag + "</label>";
    };

    setHTML(el("srcs2"), items);
    // Checkbox state is a property: keep it in sync without rewriting markup.
    document.querySelectorAll("input[data-s]").forEach((input) => {
      const want = state.sources.has(input.dataset.s) && !input.disabled;

    });
