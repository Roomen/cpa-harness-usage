  function renderStatus() {
    const notice = el("status-notice");
    const statuses = sourceStatus();
    const failures = Object.keys(statuses).filter((key) => statuses[key].status === "error");
    if (!failures.length) { setHidden(notice, true); return; }
    setAttr(notice, "data-kind", "warning");
    setHTML(notice, '<div class="message"><strong>' + esc(t("partialTitle")) + "</strong>" +
      failures.map((key) => '<div class="detail">' + esc(sourceLabel(key)) + " · " + esc(errorLabel(statuses[key].error)) + "</div>").join("") +
      '</div><button class="ctl" type="button" data-retry="1">' + esc(t("retry")) + "</button>");
    setHidden(notice, false);
  }

  // ---------- usage ----------
  function renderSummary(entries, from, to) {
    const tot = totalsOf(entries);
    const other = Math.max(0, tot.total - tot.input - tot.output - tot.cacheRead - tot.cacheWrite);
    const parts = [["summaryInput", tot.input, "--in"], ["summaryOutput", tot.output, "--out"], ["summaryCacheRead", tot.cacheRead, "--cr"], ["summaryCacheWrite", tot.cacheWrite, "--cw"]];
    if (other > 0) parts.push(["summaryOther", other, "--oth"]);
    const pct = (v) => (tot.total ? (v / tot.total) * 100 : 0);
    setHTML(el("sum"),
      '<div class="kpi"><div class="l">' + esc(t("summaryTokens")) + '</div><div class="v num">' + esc(formatTokens(tot.total)) + '</div><div class="s num">' + esc(formatExact(tot.total)) + "</div></div>" +
      '<div class="kpi"><div class="l">' + esc(t("summaryCost")) + '</div><div class="v num">' + esc(formatCost(costFor(entries, from, to))) + '</div><div class="s">' + esc(t("costHint")) + "</div></div>" +
      '<div class="comp"><div class="stack">' + parts.map((p) => '<span style="width:' + pct(p[1]).toFixed(3) + "%;background:var(" + p[2] + ')" title="' + esc(t(p[0])) + '"></span>').join("") + "</div>" +
      '<div class="legend">' + parts.map((p) => '<span class="item"><span class="dot" style="background:var(' + p[2] + ')"></span>' + esc(t(p[0])) + '<b class="num">' + esc(formatTokens(p[1])) + '</b><span class="num">' + pct(p[1]).toFixed(1) + "%</span></span>").join("") + "</div></div>");
    const extra = state.range === "custom" || state.range === "today" ? "" : " · " + (from === to ? from : from + " – " + to);
    setText(el("range-note"), rangeLabel() + extra + " · " + t("nSources", { n: selectedSources().length }));
  }

  const UNATTRIBUTED = "\u0000unattributed";
  function chartKeys(entries) {
    const totals = new Map();
    entries.forEach((e) => {
      const k = state.group === "model" ? (e.model || UNATTRIBUTED) : e.source;
      totals.set(k, (totals.get(k) || 0) + e.total);
    });
    const ranked = Array.from(totals.entries()).sort((a, b) => b[1] - a[1]).map((x) => x[0]);
    const keys = ranked.slice(0, 6).map((k, i) => ({
      k, c: state.group === "source" ? (SOURCE_COLORS[k] || PALETTE[i % PALETTE.length]) : PALETTE[i % PALETTE.length],
      name: state.group === "source" ? sourceLabel(k) : k === UNATTRIBUTED ? t("unattributed") : k
    }));
    if (ranked.length > 6) keys.push({ k: "\u0000other", c: "var(--c7)", name: t("other") });
    const map = new Map(keys.map((k) => [k.k, k]));
    const keyFor = (e) => {
      const k = state.group === "model" ? (e.model || UNATTRIBUTED) : e.source;
      return map.has(k) ? k : "\u0000other";
    };
    return { keys, keyFor };
  }

  let chartState = null;
  function renderChart(entries, from, to) {
    const svg = el("chart");
    const W = Math.round(svg.clientWidth), H = Math.round(svg.clientHeight);
    const single = from === to;
    const { keys, keyFor } = chartKeys(entries);
    setHTML(el("chart-legend"), single ? "" : keys.map((k) => '<span class="item"><span class="dot" style="background:' + k.c + '"></span>' + esc(k.name) + "</span>").join(""));
    setHidden(el("gran"), single);
    if (!W || !H) return;
    setAttr(svg, "viewBox", "0 0 " + W + " " + H);
    if (single) drawBreakdown(svg, W, H, entries, keys, keyFor, from);
    else drawTrend(svg, W, H, entries, keys, keyFor, from, to);
    setAttr(svg, "aria-label", el("chart-title").textContent);
  }

  // One day selected: the trend would collapse to one bar, so show its composition.
  function drawBreakdown(svg, W, H, entries, keys, keyFor, day) {
    chartState = null;
    setText(el("chart-title"), t("breakdown", { date: day }));
    const agg = {};
    entries.forEach((e) => { const k = keyFor(e); agg[k] = (agg[k] || 0) + e.total; });
    const list = keys.filter((k) => agg[k.k]).map((k) => Object.assign({}, k, { v: agg[k.k] })).sort((a, b) => b.v - a.v);
    if (!list.length) { setHTML(svg, '<text x="' + W / 2 + '" y="' + H / 2 + '" text-anchor="middle">' + esc(t("dayEmpty")) + "</text>"); return; }
    const max = list[0].v, tot = list.reduce((a, b) => a + b.v, 0);
    const labW = Math.min(170, W * 0.36), valW = 92, rowH = Math.min(34, (H - 8) / list.length), bh = Math.min(16, rowH * 0.55);
    let out = "";
    list.forEach((k, i) => {
      const y = 4 + i * rowH + rowH / 2, bw = Math.max(2, (W - labW - valW) * k.v / max);
      const name = k.name.length > 26 ? k.name.slice(0, 25) + "…" : k.name;
      out += '<text x="' + (labW - 10) + '" y="' + (y + 4) + '" text-anchor="end" style="fill:var(--fg)">' + esc(name) + "</text>";
      out += '<rect x="' + labW + '" y="' + (y - bh / 2) + '" width="' + bw.toFixed(1) + '" height="' + bh + '" rx="3" style="fill:' + k.c + '"/>';
      out += '<text x="' + (labW + bw + 8).toFixed(1) + '" y="' + (y + 4) + '">' + esc(formatTokens(k.v)) + " · " + ((k.v / tot) * 100).toFixed(0) + "%</text>";
    });
    setHTML(svg, out);
  }

  function drawTrend(svg, W, H, entries, keys, keyFor, from, to) {
    const g = effGran();
    setText(el("chart-title"), t({ day: "trendDay", week: "trendWeek", month: "trendMonth" }[g]));
    const now = today();
    const buckets = [], index = {};
    for (let d = from; d <= to; d = addDays(d, 1)) {
      const b = bucketStart(d, g);
      if (!(b in index)) { index[b] = buckets.length; buckets.push({ key: b, first: d, last: d, s: {} }); }
      buckets[index[b]].last = d;
    }
    entries.forEach((e) => {
      const b = buckets[index[bucketStart(e.date, g)]];
      if (!b) return;
      const k = keyFor(e);
      b.s[k] = (b.s[k] || 0) + e.total;
    });
    const pl = 46, pr = 8, pt = 8, pb = 22, iw = W - pl - pr, ih = H - pt - pb;
    const max = Math.max(1, ...buckets.map((b) => Object.values(b.s).reduce((a, c) => a + c, 0)));
    const step = Math.pow(10, Math.floor(Math.log10(max / 4)));
    const tick = [1, 2, 2.5, 5, 10].map((m) => m * step).find((v) => max / v <= 5) || max;
    const top = Math.ceil(max / tick) * tick, y = (v) => pt + ih - (v / top) * ih;
    const bw = iw / buckets.length, gap = Math.min(g === "day" ? 4 : 8, bw * 0.25);
    const lab = (b) => (g === "month" ? b.key.slice(2, 7).replace("-", "/") : short(b.key));
    let out = "";
    for (let v = 0; v <= top + 1e-9; v += tick) out += '<line class="grid" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '"/><text x="' + (pl - 6) + '" y="' + (y(v) + 4).toFixed(1) + '" text-anchor="end">' + esc(formatTokens(v)) + "</text>";
    const every = Math.ceil(buckets.length / Math.max(2, Math.floor(iw / 56)));
    buckets.forEach((b, i) => {
      let acc = 0;
      const x = pl + i * bw + gap / 2;
      // Buckets cut by the range edge or still running (today) are drawn lighter.
      const partial = g === "day" ? b.key === now : (b.key < from || bucketEnd(b.key, g) > to || (b.key <= now && bucketEnd(b.key, g) >= now));
      keys.forEach((k) => {
        const v = b.s[k.k] || 0;
        if (!v) return;
        out += '<rect x="' + x.toFixed(1) + '" y="' + y(acc + v).toFixed(1) + '" width="' + Math.max(1, bw - gap).toFixed(1) + '" height="' + (y(acc) - y(acc + v)).toFixed(1) + '" rx="1.5" style="fill:' + k.c + (partial ? ";fill-opacity:.5" : "") + '"/>';
        acc += v;
      });
      out += '<rect data-i="' + i + '" x="' + (pl + i * bw).toFixed(1) + '" y="' + pt + '" width="' + bw.toFixed(1) + '" height="' + ih + '" fill="transparent"/>';
      if ((buckets.length - 1 - i) % every === 0) out += '<text x="' + (x + (bw - gap) / 2).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle">' + esc(lab(b)) + "</text>";
    });
    setHTML(svg, out);
    chartState = { buckets, keys, g };
  }

  function showTip(event) {
    const tip = el("tip");
    const i = event.target && event.target.dataset ? event.target.dataset.i : null;
    if (i == null || !chartState) { tip.hidden = true; return; }
    const b = chartState.buckets[Number(i)];
    const tot = Object.values(b.s).reduce((a, c) => a + c, 0);
    const head = chartState.g === "day" ? b.key : b.first + " – " + b.last;
    tip.innerHTML = "<div><b>" + esc(head) + '</b><span class="num">' + esc(formatTokens(tot)) + "</span></div>" +
      chartState.keys.filter((k) => b.s[k.k]).map((k) => '<div><span><span class="dot" style="background:' + k.c + '"></span> ' + esc(k.name) + '</span><span class="num">' + esc(formatTokens(b.s[k.k])) + "</span></div>").join("");
    tip.hidden = false;
    tip.style.left = Math.max(8, Math.min(event.clientX + 14, innerWidth - 290)) + "px";
    tip.style.top = event.clientY + 14 + "px";
  }

  function renderGran(from, to) {
    const n = diffDays(from, to) + 1, g = effGran();
    document.querySelectorAll("#gran button").forEach((b) => {
      const disabled = !granAllowed(b.dataset.g, n);
      if (b.disabled !== disabled) b.disabled = disabled;
      setAttr(b, "aria-pressed", String(b.dataset.g === g));
    });
    document.querySelectorAll("#group-by button").forEach((b) => setAttr(b, "aria-pressed", String(b.dataset.group === state.group)));
  }

  // Model ranking doubles as the model filter. Aggregates ignore the model
  // selection so deselected models stay listed and can be re-enabled.
  function renderRank(from, to) {
    const agg = new Map();
    buildEntries(from, to).forEach((e) => {
      if (!e.model) return;
      const a = agg.get(e.model) || { total: 0, cost: 0, costKnown: true, sources: new Set() };
      a.total += e.total;
      if (e.cost !== null) a.cost += e.cost; else a.costKnown = false;
      a.sources.add(sourceLabel(e.source));
      agg.set(e.model, a);
    });
    const list = Array.from(agg.entries()).sort((a, b) => b[1].total - a[1].total);
    const tot = list.reduce((s, x) => s + x[1].total, 0) || 1;
    const max = list.length ? Math.max(1, list[0][1].total) : 1;
    setText(el("model-meta"), list.length ? t("modelMeta", { n: list.length }) : "");
    const noneSelected = state.modelsTouched && list.length && !list.some((x) => state.models.has(x[0]));
    setHTML(el("model-notice"), noneSelected ? '<div class="notice" style="margin:0 0 10px;padding:9px 12px"><div class="message">' + esc(t("modelsNoneSelected")) + "</div></div>" : "");
    const more = el("rank-more");
    setHidden(more, list.length <= RANK_TOP);
    setText(more, state.rankAll ? t("rankCollapse") : t("rankExpand", { n: list.length }));
    const shown = state.rankAll ? list : list.slice(0, RANK_TOP);
    setHTML(el("rank"), shown.map(([m, v]) => '<li><input type="checkbox" data-m="' + esc(m) + '"' + (modelSelected(m) ? " checked" : "") + ">" +
      '<span class="name" data-mlabel="1">' + esc(m) + '</span><span class="val num">' + esc(formatTokens(v.total)) + "</span>" +
      '<div class="sub"><span class="track"><b style="width:' + ((v.total / max) * 100).toFixed(1) + '%"></b></span><span class="num">' + ((v.total / tot) * 100).toFixed(1) + '%</span><span class="srcs">' + esc(Array.from(v.sources).join(", ")) + '</span><span class="num">' + (!v.costKnown ? "" : esc(formatCost(v.cost))) + "</span></div></li>").join("") ||
      '<li style="color:var(--faint);display:block">' + esc(t("modelEmpty")) + "</li>");
    document.querySelectorAll("#rank input[data-m]").forEach((input) => {
      const want = modelSelected(input.dataset.m);
      if (input.checked !== want) input.checked = want;
    });
  }

  function renderStats(entries, from, to) {
    const sum = (list) => list.reduce((a, e) => a + e.total, 0);
    const n = diffDays(from, to) + 1, single = n === 1, now = today(), first = firstDate();
    const total = sum(entries);
    let inp = 0, cr = 0;
    entries.forEach((e) => { inp += e.input; cr += e.cacheRead; });
    const pf = addDays(from, -n), pe = addDays(from, -1);
    const prevTotal = pf >= first ? sum(filteredEntries(pf, pe)) : 0;
    const delta = pf >= first && prevTotal ? ((total - prevTotal) / prevTotal) * 100 : null;
    const cmp = single ? (from === now ? t("statPrevToday") : t("statPrevDay")) : t("statPrevN", { n });
    const cells = [];
    if (single) {
      const srcs = new Set(), models = new Set();
      entries.forEach((e) => { if (e.total) { srcs.add(e.source); if (e.model) models.add(e.model); } });
      cells.push([t("statActive"), srcs.size + " / " + models.size, t("statActiveHint")]);
      const avg7 = sum(filteredEntries(addDays(from, -7), addDays(from, -1))) / 7;
      cells.push([t("statAvg7"), formatTokens(Math.round(avg7)), avg7 ? t("statAvg7Hint", { p: ((total / avg7) * 100).toFixed(0) }) : "—"]);
    } else {
      const byDay = {};
      entries.forEach((e) => { byDay[e.date] = (byDay[e.date] || 0) + e.total; });
      const active = Object.keys(byDay).filter((d) => byDay[d] > 0);
      const peak = active.sort((a, b) => byDay[b] - byDay[a])[0];
      cells.push([t("statAvg"), formatTokens(Math.round(total / Math.max(1, active.length))), t("statActiveDays", { a: active.length, n })]);
      cells.push([t("statPeak"), peak ? formatTokens(byDay[peak]) : "—", peak || "—"]);
    }
    cells.push([cmp, delta === null ? "—" : (delta > 0 ? "+" : "") + delta.toFixed(0) + "%", delta === null ? t("statNoPrev") : (pf === pe ? pf : short(pf) + " – " + short(pe)) + "：" + formatTokens(prevTotal), delta === null ? "" : delta > 0 ? "up" : "down"]);
    cells.push([t("statCache"), ((cr / Math.max(1, inp + cr)) * 100).toFixed(1) + "%", t("statCacheHint")]);
    setHTML(el("stats"), cells.map((c) => '<div class="stat"><div class="l">' + esc(c[0]) + '</div><div class="v num ' + (c[3] || "") + '">' + esc(c[1]) + '</div><div class="s num">' + esc(c[2]) + "</div></div>").join(""));
  }

  function renderDetails(entries) {
    const byDate = new Map();
    entries.forEach((e) => { if (!byDate.has(e.date)) byDate.set(e.date, []); byDate.get(e.date).push(e); });
    const dates = Array.from(byDate.keys()).sort().reverse();
    setHidden(el("more-btn").parentNode, dates.length <= state.shown);
    const now = today();
    let rows = "", cards = "";
    dates.slice(0, state.shown).forEach((date) => {
      const list = byDate.get(date).slice().sort((a, b) => b.total - a.total);
      const tot = totalsOf(list);
      const collapsed = state.collapsed.has(date);
      const cost = tot.costUnknown && !allModelsSelected() ? null : costFor(list, date, date);
      rows += '<tr class="day" data-day="' + date + '" aria-expanded="' + !collapsed + '"><td class="num">' + date + (date === now ? ' <span class="chip">' + esc(t("inProgress")) + "</span>" : "") +
        '</td><td style="color:var(--muted);font-weight:400">' + esc(t("rowsN", { n: list.length })) + '</td><td colspan="4"></td><td class="n num">' + esc(formatTokens(tot.total)) + '</td><td class="n num">' + costHTML(cost) + "</td></tr>";
      cards += '<button type="button" class="dhead num" data-day="' + date + '">' + date + " · " + esc(formatTokens(tot.total)) + (collapsed ? " ›" : "") + "</button>";
      if (collapsed) return;
      list.forEach((e) => {
        const color = SOURCE_COLORS[e.source] || "var(--c7)";
        const model = e.model || t("unattributed");
        rows += '<tr><td><span class="srcname"><span class="dot" style="background:' + color + '"></span>' + esc(sourceLabel(e.source)) + '</span></td><td class="model" title="' + esc(model) + '">' + esc(model) +
          '</td><td class="n num">' + esc(formatTokens(e.input)) + '</td><td class="n num">' + esc(formatTokens(e.output)) + '</td><td class="n num">' + esc(formatTokens(e.cacheRead)) + '</td><td class="n num">' + esc(formatTokens(e.cacheWrite)) +
          '</td><td class="n num"><b>' + esc(formatTokens(e.total)) + '</b></td><td class="n num">' + costHTML(e.cost) + "</td></tr>";
        cards += '<div class="dcard"><div class="t"><span class="dot" style="background:' + color + '"></span><span class="m">' + esc(model) + '</span><b class="num">' + esc(formatTokens(e.total)) + "</b></div>" +
          '<div class="g num"><span>' + esc(t("summaryInput")) + "<b>" + esc(formatTokens(e.input)) + "</b></span><span>" + esc(t("summaryOutput")) + "<b>" + esc(formatTokens(e.output)) + "</b></span><span>" + esc(t("summaryCacheRead")) + "<b>" + esc(formatTokens(e.cacheRead)) + "</b></span><span>" + esc(t("summaryCost")) + "<b>" + costHTML(e.cost) + "</b></span></div></div>";
      });
    });
    setHTML(el("rows"), rows || '<tr><td colspan="8" style="color:var(--faint);text-align:center;padding:24px">' + esc(t("modelEmpty")) + "</td></tr>");
    setHTML(el("cards"), cards || '<p style="color:var(--faint);text-align:center">' + esc(t("modelEmpty")) + "</p>");
  }

  function render() {
    if (!state.report) return;
    reconcileSelection();
    // A preset window can miss older history entirely (for example after a
    // long break). Widen to "all" once, on the first snapshot only: a later
    // range chosen by the user is never overridden.
    if (state.pendingAutoRange) {
      state.pendingAutoRange = false;
      const [f0, t0] = span();
      if (state.range !== "all" && !filteredEntries(f0, t0).length && hasAnyData()) state.range = "all";
    }
    const [from, to] = span();
    const base = buildEntries(from, to);
    const entries = filteredEntries(from, to);
    const statuses = sourceStatus();
    const failed = Object.keys(statuses).some((key) => statuses[key].status === "error");
    setHidden(el("loading"), true);
    setHidden(el("content"), false);
    setHidden(el("empty-state"), entries.length > 0 || base.length > 0 || failed);
    // The model panel is also the model filter: hiding it when every model is
    // deselected would make the selection impossible to restore.
    const show = entries.length > 0;
    setHidden(el("sum-section"), !show);
    setHidden(el("split"), !show && !base.length);
    setHidden(el("chart-panel"), !show);
    setHidden(el("details"), !show);
    renderRange();
    renderSources();
    renderStatus();
    if (show) {
      renderSummary(entries, from, to);
      renderGran(from, to);
      renderChart(entries, from, to);
      renderStats(entries, from, to);
      renderDetails(entries);
    }
    renderRank(from, to);
    setHidden(el("top-actions"), false);
  }

  // ---------- quota ----------
  function ago(iso) {
    const ms = Date.now() - Date.parse(iso);
    if (!(ms >= 0) || ms < MIN) return t("agoNow");
    if (ms < HOUR) return t("agoMin", { n: Math.floor(ms / MIN) });
    if (ms < DAY) return t("agoHour", { n: Math.floor(ms / HOUR) });
    return t("agoDay", { n: Math.floor(ms / DAY) });
  }
  function dur(ms) {
    const d = Math.floor(ms / DAY), h = Math.floor((ms % DAY) / HOUR), m = Math.max(1, Math.floor((ms % HOUR) / MIN));
    return d ? t("durDH", { d, h }) : h ? t("durHM", { h, m }) : t("durM", { m });
  }
  function windowLabel(w) {
    switch (w.kind) {
      case "session": return t("win5h");
      case "daily": return t("win1d");
      case "weekly": return t("win7d");
      case "monthly": return t("win30d");
    }
    const s = Number(w.windowSeconds) || 0;
    if (s && s % 86400 === 0) return t("winD", { n: s / 86400 });
    if (s && s % 3600 === 0) return t("winH", { n: s / 3600 });
    return t("winOther");
  }
  const sev = (rem) => (rem <= 10 ? "crit" : rem <= 30 ? "warn" : "");
  // remainingOf is null when the balance is unknown: the report omits
  // usedPercent (a session-log window already reset when the snapshot was
  // taken), or the window's reset time has passed while this page held the
  // report. A reset window no longer has a known balance, so neither the
  // percentage nor the meter may be drawn from the old value.
  const remainingOf = (w, now = Date.now()) => {
    if (!w) return null;
    const raw = w.usedPercent;
    if (raw === null || raw === undefined) return null;
    const reset = w.resetsAt ? Date.parse(w.resetsAt) : NaN;
    if (isFinite(reset) && reset <= now) return null;
    const used = Number(raw);
    if (!isFinite(used)) return null;
    return Math.max(0, Math.min(100, Math.round(100 - used)));
  };
  const minRemaining = (a, now = Date.now()) => {
    if (a.status !== "ok") return -1;
    // Never pass remainingOf directly to map: it would receive the array
    // index as the clock and keep pre-reset balances.
    const known = (Array.isArray(a.windows) ? a.windows : []).map((w) => remainingOf(w, now)).filter((v) => v !== null);
    // Cards without a known window sort after cards with one.
    return known.length ? Math.min.apply(null, known) : 101;
  };

  function quotaError(a) {
    const map = { not_configured: "qNotConfigured", upstream_error: "qUpstream", rate_limited: "qRateLimited", keychain_denied: "qKeychain", unknown_schema: "qSchema", canceled: "qCanceled" };
    if (a.error === "token_expired") return t(a.origin === "local" ? "qExpiredLocal" : "qExpiredPool");
    return t(map[a.error] || "qGeneric");
  }

  function winHTML(w, full) {
    const now = Date.now();
    const rem = remainingOf(w, now);
    const known = rem !== null;
    const reset = w.resetsAt ? Date.parse(w.resetsAt) : NaN;
    const span = Number(w.windowSeconds) * 1000;
    const elapsed = isFinite(reset) && span > 0 ? Math.min(100, Math.max(0, 100 - ((reset - now) / span) * 100)) : null;
    const used = known ? 100 - rem : 0;
    const ahead = known && elapsed !== null && used > elapsed + 8;
    let resetText = "";
    if (w.resetSinceObserved) resetText = t("resetSince");
    else if (isFinite(reset)) resetText = reset > now ? t("resetsIn", { d: dur(reset - now) }) : t("resetSince");
    const label = windowLabel(w);
    const value = known ? rem + "%<small>" + esc(t("remaining")) + "</small>" : esc(t("quotaUnknown"));
    const aria = known
      ? ' role="meter" aria-valuenow="' + rem + '" aria-valuemin="0" aria-valuemax="100"'
      : ' role="img"';
    return '<div class="win"><div class="win-top"><span class="lbl">' + esc(label) + '</span><span class="big num' + (known ? "" : " unknown") + '">' + value + '</span><span class="reset num">' + esc(resetText) + "</span></div>" +
      '<div class="meter' + (known ? "" : " unknown") + '"' + aria + ' aria-label="' + esc(label + " " + t(known ? "remaining" : "quotaUnknown")) + '">' +
      (known ? '<b class="' + sev(rem) + '" style="width:' + rem + '%"></b>' : "") +
      (known && elapsed !== null ? '<i class="pace" style="left:calc(' + (100 - elapsed).toFixed(1) + '% - 1px)"></i>' : "") + "</div>" +
      (full && known && elapsed !== null ? '<div class="pace-txt' + (ahead ? " ahead" : "") + '">' + esc(ahead ? t("paceAhead", { n: Math.round(used - elapsed) }) : t("paceOk")) + "</div>" : "") + "</div>";
  }

  function providerName(p) { return p === "claude" ? "Claude" : p === "codex" ? "Codex" : String(p); }

  function sourceBadge(a) {
    if (a.status !== "ok" || !a.observedAt) return "";
    const key = a.source === "session_log" ? "srcSession" : a.source === "live" ? "srcLive" : "srcCache";
    const stale = a.source !== "live";
    return '<span class="src' + (stale ? " stale" : "") + '" title="' + esc(t(key + "Hint")) + '"><i></i>' + esc(t(key)) + " · " + esc(ago(a.observedAt)) + "</span>";
  }

  function bodyHTML(a, full) {
    if (a.status !== "ok") return '<div class="qerr"><b>!</b>' + esc(quotaError(a)) + "</div>";
    const windows = Array.isArray(a.windows) ? a.windows : [];
    let html = windows.length ? '<div class="wins' + (full ? "" : " one") + '">' + windows.map((w) => winHTML(w, full)).join("") + "</div>" : '<div class="qhint">' + esc(t("noWindows")) + "</div>";
    if (a.liveError) html += '<div class="qhint">' + esc(t("liveFailed", { r: quotaError({ error: a.liveError, origin: a.origin }) })) + "</div>";
    return html;
  }

  function renderQuota() {
    const section = el("quota-section");
    const host = el("quota");
    if (!state.key || el("auth-form").hidden === false) { setHidden(section, true); return; }
    setHidden(section, false);
    if (!state.quota) {
      setHTML(host, state.quotaFailed
        ? '<div class="panel quota-msg"><span>' + esc(t("quotaLoadError")) + '</span><button class="ctl" type="button" data-qretry="1">' + esc(t("retry")) + "</button></div>"
        : '<div class="panel quota-msg"><span class="spinner" aria-hidden="true"></span>' + esc(t("quotaLoading")) + "</div>");
      return;
    }
    const accounts = (Array.isArray(state.quota.accounts) ? state.quota.accounts : []).filter((a) => a && (a.origin === "pool" || a.error !== "not_configured"));
    const locals = accounts.filter((a) => a.origin === "local");
    // One clock for the whole render so summary chips, ordering, and card
    // bodies agree about which windows have already reset.
    const now = Date.now();
    const pool = accounts.filter((a) => a.origin === "pool").sort((a, b) => minRemaining(a, now) - minRemaining(b, now) || a.poolNumber - b.poolNumber);
    const mergedCount = locals.reduce((n, a) => n + (Array.isArray(a.mergedPool) ? a.mergedPool.length : 0), 0);
    const parts = locals.map((a) => {
      const merged = Array.isArray(a.mergedPool) && a.mergedPool.length ? '<span class="also" title="' + esc(t("mergedHint")) + '">= CPA ' + a.mergedPool.map((n) => "#" + n).join(", ") + "</span>" : "";
      return '<article class="panel qcard local"><div class="qhead"><span class="dot" style="background:' + (PROVIDER_COLORS[a.provider] || "var(--c7)") + '"></span><strong>' + esc(providerName(a.provider)) + '</strong><span class="plan">' + esc(t("local") + (a.plan ? " · " + a.plan : "")) + "</span>" + merged + sourceBadge(a) + "</div>" + bodyHTML(a, true) + "</article>";
    });
    if (pool.length || mergedCount || state.quota.poolStatus === "error") {
      const chips = pool.map((a) => {
        if (a.status !== "ok") return '<span class="chip warn">#' + a.poolNumber + " " + esc(t("needsAttention")) + "</span>";
        const rem = minRemaining(a, now);
        if (rem > 100) return '<span class="chip">#' + a.poolNumber + " —</span>";
        return '<span class="chip ' + (sev(rem) || "ok") + '">#' + a.poolNumber + " " + rem + "%</span>";
      }).join("");
      const note = state.quota.poolStatus === "error" ? '<div class="pool-note">' + esc(t("poolError")) + "</div>" : "";
      parts.push('<button type="button" class="panel qcard pool-toggle' + (state.poolOpen ? " open" : "") + '" data-pool="1" aria-expanded="' + state.poolOpen + '"' + (pool.length ? "" : " disabled") + '>' +
        '<div class="qhead"><strong>' + esc(t("poolTitle")) + "</strong>" + (pool.length ? '<span class="plan">' + esc(t("poolMore", { n: pool.length })) + "</span>" : "") + "</div>" +
        (state.poolOpen ? "" : '<div class="pool-mini">' + chips + "</div>") + note +
        (mergedCount ? '<div class="pool-note">' + esc(t("poolMerged", { n: mergedCount })) + "</div>" : "") +
        (pool.length ? '<span class="pool-act">' + esc(state.poolOpen ? t("collapse") : t("expand")) + "</span>" : "") + "</button>");
      if (state.poolOpen) {
        pool.forEach((a) => {
          const merged = Array.isArray(a.mergedPool) && a.mergedPool.length ? '<span class="also" title="' + esc(t("mergedHint")) + '">= #' + a.mergedPool.join(", #") + "</span>" : "";
          parts.push('<article class="panel qcard poolc"><div class="qhead"><span class="dot" style="background:' + (PROVIDER_COLORS[a.provider] || "var(--c7)") + '"></span><strong>' + esc(providerName(a.provider) + " · CPA #" + a.poolNumber) + "</strong>" + (a.plan ? '<span class="plan">' + esc(a.plan) + "</span>" : "") + merged + sourceBadge(a) + "</div>" + bodyHTML(a, false) + "</article>");
        });
      }
    }
    if (!parts.length) parts.push('<div class="panel quota-msg">' + esc(t("quotaEmpty")) + "</div>");
    setHTML(host, parts.join(""));
  }

  // renderQuota reads the clock: a window whose reset passed while the page
  // held the report drops to "unknown". Re-render exactly when the next reset
  // is due so a determined balance is never shown past its window, and keep
  // the per-minute tick for the countdown text. Neither path uses the network.
  function scheduleQuotaReset() {
    clearTimeout(state.quotaTimer);
    state.quotaTimer = 0;
    if (!state.quota || !state.key || document.hidden) return;
    const now = Date.now();
    let next = Infinity;
    (Array.isArray(state.quota.accounts) ? state.quota.accounts : []).forEach((a) => {
      if (!a || a.status !== "ok" || !Array.isArray(a.windows)) return;
      a.windows.forEach((w) => {
        const reset = w && w.resetsAt ? Date.parse(w.resetsAt) : NaN;
        if (isFinite(reset) && reset > now) next = Math.min(next, reset);
      });
    });
    if (!isFinite(next)) return;
    // setTimeout caps a delay at 32 bits; re-arm daily for far-off resets.
    state.quotaTimer = setTimeout(tickQuota, Math.min(next - now, DAY) + 1000);
  }

  function tickQuota() {
    if (document.hidden || !state.quota) return;
    renderQuota();
    // scheduleQuotaReset clears the handle it is about to replace, so the
    // per-minute tick cannot leave orphaned timers behind.
    scheduleQuotaReset();
  }

  // ---------- loading ----------
  async function apiRequest(path, method) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 90000);
    try {
      return await fetch(path, {
        method: method,
        headers: { Authorization: "Bearer " + state.key },
        cache: "no-store",
        credentials: "omit",
        signal: controller.signal
      });
    } finally {
      clearTimeout(timer);
    }
  }

  function apiGet(path) { return apiRequest(path, "GET"); }

  function authFailed() {
    state.authGeneration += 1;
    state.pricingRequest += 1;
    state.pricing = null;
    state.pricingBusy = false;
    state.pricingUpdating = false;
    state.pricingError = "";
    state.pricingReload = false;
    state.loading = false;
    state.quotaLoading = false;
    state.key = "";
    state.report = null;
    state.quota = null;
    stopAuto();
    setHidden(el("dashboard"), true);
    setHidden(el("quota-section"), true);
    setHidden(el("top-actions"), true);
    setHidden(el("auth-form"), false);
    setHidden(el("auth-error"), false);
    setText(el("auth-error"), t("authFailed"));
  }

  function showLoading() {
    setHidden(el("loading"), false);
    setHidden(el("content"), true);
    setHidden(el("empty-state"), true);
    const status = el("status-notice");
    setAttr(status, "data-kind", "info");
    setHTML(status, '<span class="spinner" aria-hidden="true"></span><div class="message">' + esc(t("loading")) + "</div>");
    setHidden(status, false);
  }

  function showLoadError() {
    setHidden(el("loading"), true);
    const notice = el("status-notice");
    setAttr(notice, "data-kind", "error");
    setHTML(notice, '<div class="message">' + esc(t("loadError")) + '</div><button class="ctl" type="button" data-retry="1">' + esc(t("retry")) + "</button>");
    setHidden(notice, false);
  }

  function updateRefreshButton() {
    const busy = state.loading || state.quotaLoading;
    const button = el("refresh");
    if (button.disabled !== busy) button.disabled = busy;
  }

  async function loadUsage(force, quiet) {
    if (!state.key || state.loading) return;
    const generation = state.authGeneration;
    const current = () => generation === state.authGeneration && !!state.key;
    state.loading = true;
    if (!quiet) { updateRefreshButton(); if (!state.report) showLoading(); }
    try {
      const response = await apiGet(DATA_PATH + (force ? "?refresh=1" : ""));
      if (!current()) return;
      if (response.status === 401 || response.status === 403) { state.loading = false; authFailed(); return; }
      if (!response.ok) throw new Error("request failed");
      const data = await response.json();
      if (!current()) return;
      if (!data || !Array.isArray(data.sources)) throw new Error("invalid payload");
      const previous = state.report;
      state.report = data;
      if (!previous) state.pendingAutoRange = true;
      state.loading = false;
      // A quiet refresh with an unchanged snapshot must not rebuild the DOM.
      if (!(quiet && previous && previous.generatedAt === data.generatedAt)) render();
    } catch (error) {
      if (!current()) return;
      state.loading = false;
      if (!state.key) return;
      if (state.report) render();
      if (!quiet) showLoadError();
    } finally {
      if (!current()) return;
      state.loading = false;
      if (!quiet) updateRefreshButton();
      if (state.pricingReload && state.key) { state.pricingReload = false; loadUsage(true, false); }
    }
  }

  // Quota loads are independent of usage loads: one failing never hides the
  // other. net=true asks the plugin to query providers (?refresh=1); the
  // plugin still reuses each account's result for five minutes.
  async function loadQuota(net, quiet) {
    if (!state.key || state.quotaLoading) return;
    if (net && Date.now() - state.lastQuotaNet < QUOTA_MIN_NET_MS && !state.forceNet) net = false;
    state.forceNet = false;
    const generation = state.authGeneration;
    const current = () => generation === state.authGeneration && !!state.key;
    state.quotaLoading = true;
    if (net) state.lastQuotaNet = Date.now();
    if (!quiet) updateRefreshButton();
    try {
      const response = await apiGet(QUOTA_PATH + (net ? "?refresh=1" : ""));
      if (!current()) return;
      if (response.status === 401 || response.status === 403) { state.quotaLoading = false; authFailed(); return; }
      if (!response.ok) throw new Error("request failed");
      const data = await response.json();
      if (!current()) return;
      if (!data || !Array.isArray(data.accounts)) throw new Error("invalid payload");
      state.quota = data;
      state.quotaFailed = false;
      state.quotaLoading = false;
      renderQuota();
      scheduleQuotaReset();
      // Opening the page fetches live quota once when the plugin has nothing
      // recent; later network queries only come from ⟳ or auto refresh.
      if (!net && !quiet && needsNet(data)) loadQuota(true, false);
    } catch (error) {
      if (!current()) return;
      state.quotaLoading = false;
      if (!state.key) return;
      if (!state.quota) state.quotaFailed = true;
      renderQuota();
    } finally {
      if (!current()) return;
      state.quotaLoading = false;
      if (!quiet) updateRefreshButton();
    }
  }

  // Price downloads only start from the explicit button. All requests stay
  // on the authenticated CPA management route; the browser never contacts CloudPrice.
  function renderPricing() {
    const button = el("update-prices");
    button.disabled = !state.key || state.pricingBusy;
    setText(button, t(state.pricingUpdating ? "pricingUpdating" : "pricingUpdate"));
    setAttr(button, "aria-busy", String(state.pricingUpdating));
    let message = state.pricingError ? "" : t("pricingLoading");
    if (state.pricing) {
      message = state.pricing.status === "empty" ? t("pricingEmpty") : t(state.pricing.updatedAt ? "pricingReady" : "pricingCount", {
        n: formatExact(state.pricing.modelCount),
        d: new Date(state.pricing.updatedAt).toLocaleString(state.language)
      });
    }
    if (state.pricing && state.pricing.upstreamUpdatedAt) message += " · " + t("pricingDatasetDate", {
      d: new Date(state.pricing.upstreamUpdatedAt).toLocaleDateString(state.language, { timeZone: "UTC" })
    });
    setText(el("pricing-status"), message);
    setText(el("pricing-error"), state.pricingError ? t(state.pricingError) : "");
    setHidden(el("pricing-error"), !state.pricingError);
  }

  async function loadPricing(update) {
    if (!state.key || state.pricingBusy) return;
    const generation = state.authGeneration;
    const request = ++state.pricingRequest;
    const current = () => generation === state.authGeneration && request === state.pricingRequest && !!state.key;
    state.pricingBusy = true;
    state.pricingUpdating = update;
    state.pricingError = "";
    renderPricing();
    try {
      const response = await apiRequest(PRICING_PATH, update ? "POST" : "GET");
      if (!current()) return;
      if (response.status === 401 || response.status === 403) { authFailed(); return; }
      if (!response.ok) throw new Error("request failed");
      const data = await response.json();
      if (!current()) return;
      if (!data || data.source !== "CloudPrice" || !["empty", "ready"].includes(data.status) ||
          !Number.isSafeInteger(data.modelCount) || data.modelCount < 0 ||
          (data.updatedAt !== undefined && (typeof data.updatedAt !== "string" || !isFinite(Date.parse(data.updatedAt)))) ||
          (data.upstreamUpdatedAt !== undefined && (typeof data.upstreamUpdatedAt !== "string" || !isFinite(Date.parse(data.upstreamUpdatedAt))))) throw new Error("invalid payload");
      state.pricing = data;
      if (update) {
        if (state.loading) state.pricingReload = true;
        else loadUsage(true, false);
      }
    } catch (error) {
      if (current()) state.pricingError = update ? "pricingUpdateError" : "pricingStatusError";
    } finally {
      if (current()) {
        state.pricingBusy = false;
        state.pricingUpdating = false;
        renderPricing();
      }
    }
  }

  function needsNet(data) {
    const refreshed = data.refreshedAt ? Date.parse(data.refreshedAt) : NaN;
    return !(Date.now() - refreshed < QUOTA_MIN_NET_MS);
  }

  function loadAll(force) {
    loadUsage(force, false);
    if (force) state.forceNet = true;
    loadQuota(force, false);
  }

  // Auto refresh runs only while the page is visible: a hidden or closed page
  // never queries the collector or provider APIs. It never forces a usage
  // rescan; quota network queries stay at least five minutes apart.
  function autoTick() {
    if (document.hidden || !state.key) return;
    state.lastAuto = Date.now();
    loadUsage(false, true);
    loadQuota(true, true);
  }

  function scheduleAuto() {
    clearTimeout(state.timer);
    const seconds = Number(state.auto);
    if (!seconds) return;
    state.timer = setTimeout(() => { autoTick(); scheduleAuto(); }, seconds * 1000);
  }

  function startAuto(seconds) {
    state.auto = String(seconds);
    if (el("auto-refresh").value !== state.auto) el("auto-refresh").value = state.auto;
    document.querySelectorAll("#auto2 button").forEach((b) => setAttr(b, "aria-pressed", String(b.dataset.a === state.auto)));
    state.lastAuto = Date.now();
    scheduleAuto();
  }

  function stopAuto() {
    clearTimeout(state.timer);
    state.timer = 0;
    state.auto = "0";
    el("auto-refresh").value = "0";
  }

  // ---------- custom range ----------
  function quickRanges() {
    const now = today();
    const monday = bucketStart(now, "week");
    const lastMonthEnd = (() => { const d = parseKey(now.slice(0, 8) + "01"); d.setDate(0); return keyOf(d); })();
    return [
      ["quickYesterday", [addDays(now, -1), addDays(now, -1)]],
      ["quickThisWeek", [monday, now]],
      ["quickLastWeek", [addDays(monday, -7), addDays(monday, -1)]],
      ["quickThisMonth", [now.slice(0, 8) + "01", now]],
      ["quickLastMonth", [lastMonthEnd.slice(0, 8) + "01", lastMonthEnd]],
      ["quickThisYear", [now.slice(0, 5) + "01-01", now]]
    ];
  }
  function fillQuick(node, fromEl, toEl, after) {
    setHTML(node, quickRanges().map((q, i) => '<button type="button" data-q="' + i + '">' + esc(t(q[0])) + "</button>").join(""));
    node.onclick = (event) => {
      const b = event.target.closest("button");
      if (!b) return;
      const range = quickRanges()[Number(b.dataset.q)][1];
      fromEl.value = range[0];
      toEl.value = range[1];
      if (after) after();
    };
  }
  function validRange(f, to) {
    if (!isDateKey(f) || !isDateKey(to)) return t("errMissing");
    if (f > to) return t("errOrder");
    if (to > today()) return t("errFuture");
    return "";
  }
  function setDateLimits() {
    const now = today();
    ["from", "to", "from2", "to2"].forEach((id) => el(id).max = now);
  }
  function openCustom() {
    const [f, to] = span();
    el("from").value = f; el("to").value = to;
    setDateLimits();
    setHidden(el("range-err"), true);
    setHidden(el("custom-pop"), false);
    el("from").focus();
  }
  function applyCustom(f, to, errEl) {
    const err = validRange(f, to);
    setText(errEl, err);
    setHidden(errEl, !err);
    if (err) return false;
    const now = today();
    state.range = f === to && f === now ? "today" : "custom";
    // Dates before the earliest recorded day are allowed and simply show an
    // empty range; clamping the start here could invert a valid range.
    state.from = f;
    state.to = to;
    state.gran = null;
    state.shown = DAYS_STEP;
    render();
    return true;
  }
  function pickRange(event, inSheet) {
    const b = event.target.closest("button");
    if (!b) return;
    if (b.dataset.r === "custom") {
      if (inSheet) {
        const [f, to] = span();
        el("from2").value = f; el("to2").value = to;
        setDateLimits();
        setHidden(el("sheet-custom"), false);
      } else {
        openCustom();
      }
      return;
    }
    state.range = b.dataset.r;
    state.gran = null;
    state.shown = DAYS_STEP;
    setHidden(el("sheet-custom"), true);
    render();
  }

  function sheet(open) {
    setHidden(el("sheet"), !open);
    setHidden(el("sheet-bg"), !open);
    if (open) setHidden(el("sheet-custom"), state.range !== "custom");
  }

  function wire() {
    el("auth-controls").addEventListener("submit", (event) => {
      event.preventDefault();
      const input = el("management-key");
      const value = input.value.trim();
      input.value = "";
      if (!value) return;
      start(value);
    });
    el("update-prices").addEventListener("click", () => loadPricing(true));
    el("refresh").addEventListener("click", () => loadAll(true));
    el("auto-refresh").addEventListener("change", (event) => startAuto(event.target.value));
    el("auto2").addEventListener("click", (event) => { const b = event.target.closest("button"); if (b) startAuto(b.dataset.a); });
    el("range").addEventListener("click", (event) => { event.stopPropagation(); pickRange(event, false); });
    el("range2").addEventListener("click", (event) => pickRange(event, true));
    el("custom-apply").addEventListener("click", () => { if (applyCustom(el("from").value, el("to").value, el("range-err"))) setHidden(el("custom-pop"), true); });
    el("custom-cancel").addEventListener("click", () => setHidden(el("custom-pop"), true));
    ["from2", "to2"].forEach((id) => el(id).addEventListener("change", () => applyCustom(el("from2").value, el("to2").value, el("range-err2"))));
    el("gran").addEventListener("click", (event) => { const b = event.target.closest("button"); if (!b || b.disabled) return; state.gran = b.dataset.g; render(); });
    el("group-by").addEventListener("click", (event) => { const b = event.target.closest("button"); if (!b) return; state.group = b.dataset.group; render(); });
    el("src-btn").addEventListener("click", (event) => {
      event.stopPropagation();
      const menu = el("src-menu");
      setHidden(menu, !menu.hidden);
      setAttr(el("src-btn"), "aria-expanded", String(!menu.hidden));
    });
    document.addEventListener("click", (event) => {
      if (!event.target.closest(".dd")) { setHidden(el("src-menu"), true); setAttr(el("src-btn"), "aria-expanded", "false"); }
      if (!event.target.closest(".range-wrap")) setHidden(el("custom-pop"), true);
      const target = event.target.closest("button");
      if (!target) return;
      if (target.dataset.retry) loadUsage(true, false);
      else if (target.dataset.qretry) { state.forceNet = true; loadQuota(true, false); }
      else if (target.dataset.pool) { state.poolOpen = !state.poolOpen; renderQuota(); }
      else if (target.dataset.sall) {
        state.sourcesTouched = true;
        const statuses = sourceStatus();
        state.sources = target.dataset.sall === "1" ? new Set(Object.keys(statuses).filter((s) => statuses[s].status !== "error")) : new Set();
        render();
      } else if (target.classList.contains("dhead")) toggleDay(target.dataset.day);
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") { setHidden(el("custom-pop"), true); setHidden(el("src-menu"), true); sheet(false); }
    });
    document.addEventListener("change", (event) => {
      const data = event.target.dataset || {};
      if (data.s) {
        state.sourcesTouched = true;
        if (event.target.checked) state.sources.add(data.s); else state.sources.delete(data.s);
        render();
      } else if (data.m) {
        state.modelsTouched = true;
        if (event.target.checked) state.models.add(data.m); else state.models.delete(data.m);
        render();
      }
    });
    el("rank").addEventListener("click", (event) => {
      const label = event.target.closest("[data-mlabel]");
      if (!label) return;
      const input = label.parentNode.querySelector("input[data-m]");
      if (input) input.click();
    });
    el("rows").addEventListener("click", (event) => { const tr = event.target.closest("tr.day"); if (tr) toggleDay(tr.dataset.day); });
    el("more-btn").addEventListener("click", () => { state.shown += DAYS_STEP; render(); });
    el("rank-more").addEventListener("click", () => { state.rankAll = !state.rankAll; render(); });
    el("filter-btn").addEventListener("click", () => sheet(true));
    el("sheet-bg").addEventListener("click", () => sheet(false));
    el("sheet-done").addEventListener("click", () => sheet(false));
    el("chart").addEventListener("pointermove", showTip);
    el("chart").addEventListener("pointerleave", () => { el("tip").hidden = true; });
    const media = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
    if (media && media.addEventListener) media.addEventListener("change", () => { if (!document.documentElement.hasAttribute("data-theme")) applyTheme(); });
    let lastBox = "", resizeTimer = 0;
    if (window.ResizeObserver) {
      new ResizeObserver((items) => {
        const r = items[0].contentRect, key = Math.round(r.width) + "x" + Math.round(r.height);
        if (key === lastBox) return;
        lastBox = key;
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => { if (state.report && !el("chart-panel").hidden) { const [f, to] = span(); renderChart(filteredEntries(f, to), f, to); } }, 40);
      }).observe(el("chart-box"));
    }
    window.addEventListener("storage", (event) => {
      if (event.key === STORAGE_LANGUAGE || event.key === STORAGE_THEME) { applyTheme(); applyLanguage(); }
    });
    document.addEventListener("visibilitychange", () => {
      if (document.hidden || !state.key) return;
      renderQuota(); // countdowns and windows that reset while hidden
      scheduleQuotaReset();
      const seconds = Number(state.auto);
      if (seconds && Date.now() - state.lastAuto >= seconds * 1000) { autoTick(); scheduleAuto(); }
    });
    // Reset countdowns are relative; refresh their text while visible. No
    // network request is made here.
    setInterval(tickQuota, MIN);
  }

  function toggleDay(day) {
    if (!day) return;
    if (state.collapsed.has(day)) state.collapsed.delete(day); else state.collapsed.add(day);
    render();
  }

  function start(key) {
    state.authGeneration += 1;
    state.pricingRequest += 1;
    state.pricing = null;
    state.pricingBusy = false;
    state.pricingUpdating = false;
    state.pricingError = "";
    state.pricingReload = false;
    state.loading = false;
    state.quotaLoading = false;
    state.key = key;
    setHidden(el("auth-error"), true);
    setHidden(el("auth-form"), true);
    setHidden(el("dashboard"), false);
    setHidden(el("top-actions"), false);
    renderQuota();
    loadAll(false);
    loadPricing(false);
  }

  applyTheme();
  applyLanguage();
  wire();

  const saved = readSavedKey();
  if (saved) start(saved);
  else el("management-key").focus();
})();
</script>
</body>
</html>
