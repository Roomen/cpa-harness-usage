<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Harness Usage</title>
<style>
:root {
  --bg: #f5f7fa;
  --bg-glow: rgba(44, 107, 237, .09);
  --surface: #ffffff;
  --surface-alt: #eef2f6;
  --fg: #16202b;
  --muted: #5d6b7a;
  --border: #dde3ea;
  --accent: #2c6bed;
  --accent-soft: #e7eefd;
  --success: #127a4b;
  --warning: #96650a;
  --error: #b42318;
  --error-soft: #fdecea;
  --c1: #2c6bed;
  --c2: #0f9d76;
  --c3: #e08a04;
  --c4: #8b5cf6;
  --c5: #e05252;
  --c6: #0e9bb5;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 10px 28px rgba(16, 24, 40, .05);
  --radius: 16px;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
[data-theme="dark"] {
  --bg: #0f141a;
  --bg-glow: rgba(121, 167, 255, .10);
  --surface: #161d25;
  --surface-alt: #1e2731;
  --fg: #e8eef5;
  --muted: #9dabb9;
  --border: #2a3642;
  --accent: #79a7ff;
  --accent-soft: #1c2b44;
  --success: #4ade80;
  --warning: #fbbf24;
  --error: #f87b70;
  --error-soft: #3a1d1b;
  --c1: #79a7ff;
  --c2: #34d399;
  --c3: #fbbf24;
  --c4: #c4b5fd;
  --c5: #f87171;
  --c6: #22d3ee;
  --shadow: none;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-theme="white"]) {
    --bg: #0f141a;
    --bg-glow: rgba(121, 167, 255, .10);
    --surface: #161d25;
    --surface-alt: #1e2731;
    --fg: #e8eef5;
    --muted: #9dabb9;
    --border: #2a3642;
    --accent: #79a7ff;
    --accent-soft: #1c2b44;
    --success: #4ade80;
    --warning: #fbbf24;
    --error: #f87b70;
    --error-soft: #3a1d1b;
    --c1: #79a7ff;
    --c2: #34d399;
    --c3: #fbbf24;
    --c4: #c4b5fd;
    --c5: #f87171;
    --c6: #22d3ee;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { max-width: 100%; overflow-x: hidden; }
html { background-color: var(--bg); }
body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(1100px 520px at 8% -12%, var(--bg-glow), transparent 62%),
    var(--bg);
  color: var(--fg);
  font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans", sans-serif;
  -webkit-text-size-adjust: 100%;
}
button, input, select { font: inherit; color: inherit; }
.shell { width: 100%; max-width: 1200px; margin: 0 auto; padding: 26px 20px 52px; }
.top {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 18px; flex-wrap: wrap; margin-bottom: 22px;
}
.brand { min-width: 0; display: flex; gap: 12px; align-items: flex-start; }
.mark {
  width: 38px; height: 38px; border-radius: 11px; flex: none; margin-top: 2px;
  background: linear-gradient(140deg, var(--accent), var(--c4));
  display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 15px;
  box-shadow: 0 6px 16px rgba(44, 107, 237, .25);
}
h1 { margin: 0; font-size: clamp(20px, 2.6vw, 25px); letter-spacing: -.015em; }
.subtitle { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
.top-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 38px; padding: 7px 14px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--surface); color: var(--fg);
  cursor: pointer; white-space: nowrap; transition: border-color .15s, background .15s, transform .06s;
}
.btn:hover { border-color: var(--accent); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.06); }
[data-theme="dark"] .btn.primary { color: #0b1220; }
.btn:disabled { opacity: .55; cursor: progress; }
.btn.ghost { background: transparent; }
.select-wrap { display: inline-flex; align-items: center; gap: 7px; padding: 0 4px 0 11px; min-height: 38px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
.select-wrap span { font-size: 12px; color: var(--muted); white-space: nowrap; }
.select-wrap select { border: 0; background: transparent; min-height: 34px; padding: 0 8px 0 0; cursor: pointer; }
.select-wrap:focus-within { border-color: var(--accent); }
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow);
}
.auth { max-width: 470px; margin: 56px auto; padding: 30px; }
.auth h2 { margin: 0 0 8px; font-size: 19px; }
.auth p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label { font-size: 12px; font-weight: 600; color: var(--muted); }
.field input {
  width: 100%; min-width: 0; min-height: 42px; padding: 8px 11px;
  border: 1px solid var(--border); border-radius: 10px; background: var(--surface);
}
.field input:focus-visible, .btn:focus-visible, .chip input:focus-visible + span,
.rank-row:focus-visible, .seg button:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.auth-row { display: flex; gap: 10px; margin-top: 14px; }
.auth-row .btn { flex: 1; }
.auth-error { margin-top: 12px; color: var(--error); font-size: 13px; }
.notice {
  display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap;
  padding: 12px 15px; margin-bottom: 16px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--surface);
}
.notice[data-kind="error"] { border-color: var(--error); background: var(--error-soft); }
.notice[data-kind="warning"] { border-color: var(--warning); }
.notice[data-kind="info"] { background: var(--surface); }
.notice .message { flex: 1 1 240px; min-width: 0; }
.notice .detail { color: var(--muted); font-size: 12px; margin-top: 2px; }
.summary-grid {
  display: grid; gap: 12px; margin-bottom: 16px;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
}
.stat { position: relative; padding: 15px 16px 14px; overflow: hidden; }
.stat::before {
  content: ""; position: absolute; inset: 0 auto 0 0; width: 3px;
  background: var(--stat-color, var(--accent));
}
.stat .label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.stat .value { margin-top: 5px; font-size: clamp(19px, 2.3vw, 25px); font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -.015em; overflow-wrap: anywhere; }
.stat .sub { margin-top: 2px; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.toolbar { display: flex; gap: 18px; flex-wrap: wrap; padding: 15px 16px; margin-bottom: 16px; align-items: flex-start; }
.toolbar .group { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.toolbar .group.grow { flex: 1 1 300px; }
.group-head { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.group-label { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .01em; }
.linkish { border: 0; background: none; color: var(--accent); font-size: 12px; cursor: pointer; padding: 2px 4px; border-radius: 6px; }
.linkish:hover { background: var(--accent-soft); }
.chips { display: flex; gap: 7px; flex-wrap: wrap; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.chip span {
  display: inline-flex; align-items: center; gap: 6px; min-height: 32px;
  padding: 5px 11px; border-radius: 999px; border: 1px solid var(--border);
  background: var(--surface); cursor: pointer; font-size: 12.5px; white-space: nowrap;
  transition: border-color .15s, background .15s;
}
.chip span:hover { border-color: var(--accent); }
.chip input:checked + span { border-color: var(--accent); background: var(--accent-soft); }
.chip .count { color: var(--muted); font-variant-numeric: tabular-nums; }
.range { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.range input[type="date"] {
  min-height: 34px; padding: 4px 8px; border: 1px solid var(--border);
  border-radius: 9px; background: var(--surface); min-width: 0; max-width: 100%;
}
.range .sep { color: var(--muted); font-size: 12px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 7px 12px; font-size: 12.5px; cursor: pointer; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--fg); font-weight: 600; }
.panel { padding: 17px; margin-bottom: 16px; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 13px; }
.panel-head h2 { margin: 0; font-size: 16px; letter-spacing: -.01em; }
.panel-head .meta { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.chart-scroll { overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; }
#chart { display: block; }
#chart rect { transition: opacity .12s; }
#chart rect:hover { opacity: .82; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.models { display: grid; gap: 2px; }
.model-row {
  display: grid; grid-template-columns: 22px minmax(120px, 1.5fr) minmax(90px, 1fr) 86px 92px;
  gap: 10px; align-items: center; padding: 8px 6px; border-radius: 9px;
}
.model-row + .model-row { border-top: 1px solid var(--border); }
.model-row.head { color: var(--muted); font-size: 11.5px; font-weight: 600; padding-bottom: 4px; }
.model-row.head > span:first-child { visibility: hidden; }
.model-row .rank-check { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
.model-name { min-width: 0; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.model-name .src { display: block; color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
.share { height: 7px; border-radius: 999px; background: var(--surface-alt); box-shadow: inset 0 0 0 1px var(--border); overflow: hidden; }
.share i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--c1), var(--c6)); }
.num { text-align: right; font-variant-numeric: tabular-nums; font-size: 12.5px; white-space: nowrap; }
.num.muted { color: var(--muted); }
.table-scroll { overflow: auto; max-height: 540px; -webkit-overflow-scrolling: touch; border-radius: 10px; }
table { width: 100%; border-collapse: collapse; min-width: 760px; font-variant-numeric: tabular-nums; }
caption { text-align: left; padding-bottom: 8px; color: var(--muted); font-size: 12px; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; }
th { position: sticky; top: 0; background: var(--surface-alt); font-size: 11.5px; color: var(--muted); font-weight: 600; z-index: 1; }
th:first-child, td:first-child, th:nth-child(2), td:nth-child(2), th:nth-child(3), td:nth-child(3) { text-align: left; }
td:nth-child(3) { max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--surface-alt); }
td.muted { color: var(--muted); }
tfoot td { font-weight: 650; border-bottom: 0; background: var(--surface); }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; }
.badge .name { color: var(--fg); }
.mono { font-family: var(--mono); font-size: 12px; }
.empty { padding: 44px 20px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--fg); margin-bottom: 6px; font-size: 15px; }
.spinner {
  width: 16px; height: 16px; border-radius: 50%;
  border: 2px solid var(--border); border-top-color: var(--accent);
  animation: spin .8s linear infinite; flex: none;
}
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } .btn, #chart rect { transition: none; } }
.skeleton { display: grid; gap: 12px; }
.skeleton .bar { height: 76px; border-radius: 12px; background: var(--surface-alt); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .55; } }
.footnote { color: var(--muted); font-size: 11.5px; margin-top: 14px; line-height: 1.6; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
[hidden] { display: none !important; }
@media (max-width: 720px) {
  .shell { padding: 16px 12px 36px; }
  .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .stat { padding: 12px 13px; }
  .toolbar { padding: 13px; gap: 14px; }
  .panel { padding: 13px; }
  .auth { margin: 18px auto; padding: 21px; }
  .range { gap: 6px; }
  .range input[type="date"] { flex: 1 1 130px; }
  .top-actions { width: 100%; }
  .top-actions .btn { flex: 1; }
  .select-wrap { flex: 1; justify-content: space-between; }
  .model-row { grid-template-columns: 20px minmax(90px, 1fr) 66px 76px; align-items: start; }
  .model-row .share,
  .model-row.head > span:nth-child(3) { display: none; }
  .model-name { white-space: normal; overflow-wrap: anywhere; line-height: 1.35; }
}
@media (min-width: 980px) {
  .summary-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); }
}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true">H</div>
      <div>
        <h1 data-i18n="appTitle">Harness 用量</h1>
        <p class="subtitle" data-i18n="subtitle"></p>
      </div>
    </div>
    <div class="top-actions" id="top-actions" hidden>
      <label class="select-wrap">
        <span data-i18n="autoRefresh"></span>
        <select id="auto-refresh">
          <option value="0" data-i18n="autoOff"></option>
          <option value="30">30 s</option>
          <option value="60">1 min</option>
          <option value="300">5 min</option>
        </select>
      </label>
      <button class="btn" id="refresh" type="button" data-i18n="refresh">刷新</button>
    </div>
  </header>

  <section class="card auth" id="auth-form">
    <h2 data-i18n="authTitle"></h2>
    <p data-i18n="authHint"></p>
    <form id="auth-controls" novalidate>
      <div class="field">
        <label for="management-key" data-i18n="authPlaceholder"></label>
        <input id="management-key" name="management-key" type="password" autocomplete="off" spellcheck="false" autocapitalize="off" required>
      </div>
      <div class="auth-row">
        <button class="btn primary" id="connect" type="submit" data-i18n="connect"></button>
      </div>
    </form>
    <div class="auth-error" id="auth-error" role="alert" hidden></div>
  </section>

  <section id="dashboard" hidden aria-live="polite">
    <div id="status-notice" class="notice" hidden></div>

    <div id="loading" class="skeleton" hidden aria-label="loading">
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </div>

    <div id="content" hidden>
      <div class="summary-grid" id="summary"></div>

      <div class="card toolbar">
        <div class="group grow">
          <div class="group-head">
            <span class="group-label" data-i18n="filterSources"></span>
            <span>
              <button class="linkish" type="button" id="sources-all" data-i18n="all"></button>
              <button class="linkish" type="button" id="sources-none" data-i18n="none"></button>
            </span>
          </div>
          <div class="chips" id="source-filter"></div>
        </div>
        <div class="group grow">
          <div class="group-head">
            <span class="group-label" data-i18n="filterRange"></span>
          </div>
          <div class="chips" id="range-presets"></div>
          <div class="range">
            <label class="sr-only" for="date-from" data-i18n="from"></label>
            <input id="date-from" type="date">
            <span class="sep" aria-hidden="true">–</span>
            <label class="sr-only" for="date-to" data-i18n="to"></label>
            <input id="date-to" type="date">
          </div>
        </div>
      </div>

      <div class="card panel">
        <div class="panel-head">
          <h2 data-i18n="trendTitle"></h2>
          <div class="seg" id="group-by" role="group" aria-label="group">
            <button type="button" data-group="source" aria-pressed="true" data-i18n="groupSource"></button>
            <button type="button" data-group="model" aria-pressed="false" data-i18n="groupModel"></button>
          </div>
          <span class="meta" id="generated"></span>
        </div>
        <div class="chart-scroll" id="chart-scroll">
          <svg id="chart" role="img" aria-labelledby="chart-title" width="100%" height="270"></svg>
          <span class="sr-only" id="chart-title"></span>
        </div>
        <div class="legend" id="legend"></div>
      </div>

      <div class="card panel" id="model-panel">
        <div class="panel-head">
          <h2 data-i18n="modelTitle"></h2>
          <span class="meta" id="model-meta"></span>
        </div>
        <div class="models" id="model-list"></div>
        <div class="footnote" data-i18n="modelCostNote"></div>
      </div>

      <div class="card panel">
        <div class="panel-head">
          <h2 data-i18n="tableTitle"></h2>
        </div>
        <div class="table-scroll" tabindex="0" aria-label="Details">
          <table>
            <caption class="sr-only" data-i18n="tableTitle"></caption>
            <thead>
              <tr>
                <th scope="col" data-i18n="date"></th>
                <th scope="col" data-i18n="source"></th>
                <th scope="col" data-i18n="model"></th>
                <th scope="col" data-i18n="summaryInput"></th>
                <th scope="col" data-i18n="summaryOutput"></th>
                <th scope="col" data-i18n="summaryCacheRead"></th>
                <th scope="col" data-i18n="summaryCacheWrite"></th>
                <th scope="col" data-i18n="summaryTokens"></th>
                <th scope="col" data-i18n="summaryCost"></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
            <tfoot id="rows-total"></tfoot>
          </table>
        </div>
        <div class="footnote" data-i18n="costNote"></div>
      </div>
    </div>

    <div class="card empty" id="empty-state" hidden>
      <strong data-i18n="emptyTitle"></strong>
      <span data-i18n="emptyHint"></span>
    </div>
  </section>
</div>

<script>
"use strict";
(function () {
  const DATA_PATH = "/v0/management/harness-usage/daily";
  const PAGE_PATH = "/v0/resource/plugins/harness-usage/usage";
  const SOURCES = [
    "claude", "codex", "opencode", "omp", "pi", "amp", "droid", "codebuff",
    "hermes", "goose", "kilo", "copilot", "gemini", "antigravity", "kimi",
    "qwen", "openclaw", "grok", "zcode"
  ];
  const SOURCE_LABELS = {
    claude: "Claude Code", codex: "Codex", opencode: "OpenCode", omp: "oh-my-pi",
    pi: "pi agent", amp: "Amp", droid: "Droid", codebuff: "Codebuff",
    hermes: "Hermes", goose: "Goose", kilo: "Kilo", copilot: "GitHub Copilot CLI",
    gemini: "Gemini CLI", antigravity: "Antigravity", kimi: "Kimi", qwen: "Qwen",
    openclaw: "OpenClaw", grok: "Grok CLI", zcode: "ZCode"
  };
  const SOURCE_COLORS = {};
  const PALETTE = ["var(--c1)", "var(--c2)", "var(--c3)", "var(--c4)", "var(--c5)", "var(--c6)"];
  SOURCES.forEach((source, index) => { SOURCE_COLORS[source] = PALETTE[index % PALETTE.length]; });
  const STORAGE_LANGUAGE = "cli-proxy-language";
  const STORAGE_THEME = "cli-proxy-theme";
  const STORAGE_AUTH = "cli-proxy-auth";
  const OBFUSCATION_PREFIX = "enc::v1::";
  const OBFUSCATION_SALT = "cli-proxy-api-webui::secure-storage";
  const TABLE_LIMIT = 600;

  const STRINGS = {
    "zh-CN": {
      appTitle: "Harness 用量", subtitle: "本机 AI 编程代理的历史用量，按来源与模型汇总",
      authTitle: "需要管理密钥", authHint: "输入 CPA 管理密钥以读取统计。密钥只保存在当前页面内存中，不会写入地址栏或浏览器存储。",
      authPlaceholder: "CPA 管理密钥", connect: "读取用量",
      authFailed: "管理密钥无效或已过期，请重试。",
      loading: "正在读取本机用量…", loadError: "暂时无法读取用量，请稍后重试。",
      retry: "重试", refresh: "刷新", partialTitle: "部分来源不可用",
      sourceEmpty: "无数据", sourceFailed: "失败",

  const state = {
    key: "",
    report: null,

    sources: new Set(),
    sourcesTouched: false,
    models: new Set(),
    knownModels: new Set(),
    modelsTouched: false,

  const el = (id) => document.getElementById(id);
  const i18nNodes = () => document.querySelectorAll("[data-i18n]");

  function detectLanguage() {
    const candidates = [];
    try {
      const raw = localStorage.getItem(STORAGE_LANGUAGE);
      if (raw) {
        let parsed = null;
        try { parsed = JSON.parse(raw); } catch (e) { parsed = raw; }
        const value = parsed && typeof parsed === "object"
          ? (parsed.state && parsed.state.language) || parsed.language
          : parsed;
        if (typeof value === "string") candidates.push(value);
      }
    } catch (e) { /* storage unavailable */ }
    if (navigator.languages) candidates.push.apply(candidates, navigator.languages);
    candidates.push(navigator.language || "");
    for (const candidate of candidates) {
      const lower = String(candidate).toLowerCase();
      if (lower.startsWith("zh-tw") || lower.startsWith("zh-hk") || lower.startsWith("zh-mo") || lower.startsWith("zh-hant")) return "zh-TW";
      if (lower.startsWith("zh")) return "zh-CN";
      if (lower.startsWith("ru")) return "ru";
      if (lower.startsWith("vi")) return "vi";
      if (lower.startsWith("ko")) return "ko";
      if (lower.startsWith("en")) return "en";
    }
    return "en";
  }

  function t(key, vars) {
    const pack = STRINGS[state.language] || STRINGS.en;
    let value = pack[key] || STRINGS.en[key] || key;
    if (vars) Object.keys(vars).forEach((name) => { value = value.replace("{" + name + "}", String(vars[name])); });
    return value;
  }

  function applyLanguage() {
    state.language = detectLanguage();
    document.documentElement.lang = state.language;
    i18nNodes().forEach((node) => { node.textContent = t(node.dataset.i18n); });
    el("management-key").placeholder = t("authPlaceholder");
    document.title = t("appTitle");
    if (state.report) render();
    else { renderSourceFilter(); renderRangePresets(); }
  }

  // Read the management center's saved key when this page runs on the same
  // origin. The value is only kept in memory here; this page never writes it.
  function readSavedKey() {
    try {
      let raw = localStorage.getItem(STORAGE_AUTH);
      if (!raw) return "";
      if (raw.indexOf(OBFUSCATION_PREFIX) === 0) {
        const keyBytes = new TextEncoder().encode(OBFUSCATION_SALT + "|" + location.host + "|" + navigator.userAgent);
        const binary = atob(raw.slice(OBFUSCATION_PREFIX.length));
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i += 1) {
          bytes[i] = binary.charCodeAt(i) ^ keyBytes[i % keyBytes.length];
        }
        raw = new TextDecoder().decode(bytes);
      }
      const parsed = JSON.parse(raw);
      const value = parsed && parsed.state ? parsed.state.managementKey : parsed && parsed.managementKey;
      return typeof value === "string" ? value : "";
    } catch (e) {
      return "";
    }
  }

  function applyTheme() {
    let theme = "auto";
    try {
      const raw = localStorage.getItem(STORAGE_THEME);
      if (raw) {
        let parsed = null;
        try { parsed = JSON.parse(raw); } catch (e) { parsed = raw; }
        const value = parsed && typeof parsed === "object"
          ? (parsed.state && parsed.state.theme) || parsed.theme
          : parsed;
        if (typeof value === "string") theme = value;
      }
    } catch (e) { /* storage unavailable */ }
    const root = document.documentElement;
    if (theme === "dark") root.setAttribute("data-theme", "dark");
    else if (theme === "light" || theme === "white") root.setAttribute("data-theme", "light");
    else root.removeAttribute("data-theme");
  }

  function esc(value) {
    return String(value).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  }

  function formatTokens(value) {
    const n = Number(value) || 0;
    if (n < 1000) return String(n);
    const units = [[1e9, "B"], [1e6, "M"], [1e3, "K"]];
    for (const [size, suffix] of units) {
      if (n >= size) {
        const scaled = n / size;
        return (scaled >= 100 ? scaled.toFixed(0) : scaled >= 10 ? scaled.toFixed(1) : scaled.toFixed(2)) + suffix;
      }
    }
    return String(n);
  }

  function formatExact(value) {
    return (Number(value) || 0).toLocaleString(state.language);
  }

  function formatCost(value) {
    if (value === null || value === undefined) return "—";
    const n = Number(value) || 0;
    if (n === 0) return "$0.00";
    if (n < 0.01) return "<$0.01";
    if (n < 100) return "$" + n.toFixed(2);
    return "$" + n.toFixed(0);
  }

  function todayIso() {
    const now = new Date();
    const local = new Date(now.getTime() - now.getTimezoneOffset() * 60000);
    return local.toISOString().slice(0, 10);
  }

  function isoDaysAgo(days) {
    const now = new Date();
    now.setDate(now.getDate() - (days - 1));
    const local = new Date(now.getTime() - now.getTimezoneOffset() * 60000);
    return local.toISOString().slice(0, 10);
  }

  function setPreset(range) {
    state.range = range;
    if (range === "all") {
      state.from = "";
      state.to = "";
    } else {
      state.from = isoDaysAgo(Number(range));
      state.to = todayIso();
    }
    el("date-from").value = state.from;
    el("date-to").value = state.to;
    renderRangePresets();
    render();
  }

  function sourceLabel(source) { return SOURCE_LABELS[source] || source; }
  function isKnownSource(source) { return SOURCES.indexOf(source) >= 0; }

  function errorLabel(code) {
    const map = {
      timeout: "errorTimeout",
      command_failed: "errorCommandFailed",
      unknown_schema: "errorUnknownSchema",
      output_too_large: "errorOutputTooLarge",
      canceled: "errorCanceled",
      unsupported_source: "errorUnsupported"
    };
    return t(map[code] || "errorGeneric");
  }

  function sourceStatus() {
    const bySource = {};
    if (state.report && Array.isArray(state.report.sources)) {
      state.report.sources.forEach((item) => {
        if (item && typeof item.source === "string") bySource[item.source] = item;
      });
    }
    return bySource;
  }

  // Sources and models are preselected from the first report, then the user's
  // choices win. New entries appear selected so no data is hidden silently.
  function reconcileSelection() {
    const statuses = sourceStatus();
    if (!state.sourcesTouched) {
      state.sources = new Set(Object.keys(statuses).filter((source) => statuses[source].status === "ok"));
    }
    const models = collectModels();
    if (!state.modelsTouched) {
      state.models = new Set(models);
      state.knownModels = new Set(models);
      return;
    }
    const known = new Set(models);
    const knownBefore = state.knownModels || new Set();
    const next = new Set(Array.from(state.models).filter((model) => known.has(model)));
    models.forEach((model) => {
      if (!knownBefore.has(model)) next.add(model);
    });
    state.models = next;
    state.knownModels = known;
  }

  function collectModels() {
    const names = new Set();
    if (!state.report || !Array.isArray(state.report.sources)) return [];
    state.report.sources.forEach((source) => {
      if (!source || !state.sources.has(source.source) || source.status === "error") return;
      (Array.isArray(source.daily) ? source.daily : []).forEach((row) => {
        if (!row || typeof row.date !== "string") return;
        if (state.from && row.date < state.from) return;
        if (state.to && row.date > state.to) return;
        (Array.isArray(row.models) ? row.models : []).forEach((model) => {
          if (model && typeof model.model === "string") names.add(model.model);
        });
      });
    });
    return Array.from(names);
  }

  function dateInRange(date) {
    if (state.from && date < state.from) return false;
    if (state.to && date > state.to) return false;
    return true;
  }

  function selectedSources() {
    const statuses = sourceStatus();
    return Object.keys(statuses).filter((source) => state.sources.has(source) && statuses[source].status !== "error");
  }

  // Build (date, source, model) entries. A day's reported total is
  // authoritative: unattributed tokens become an "unattributed" entry instead
  // of being dropped or redistributed.
  function buildEntries() {
    const entries = [];
    if (!state.report || !Array.isArray(state.report.sources)) return entries;
    const wanted = new Set(selectedSources());
    state.report.sources.forEach((source) => {
      if (!wanted.has(source.source)) return;
      (Array.isArray(source.daily) ? source.daily : []).forEach((row) => {
        if (!row || typeof row.date !== "string" || !dateInRange(row.date)) return;
        const base = {
          date: row.date,
          source: source.source,
          input: Number(row.inputTokens) || 0,
          output: Number(row.outputTokens) || 0,
          cacheRead: Number(row.cacheReadTokens) || 0,
          cacheWrite: Number(row.cacheCreationTokens) || 0,
          total: Number(row.totalTokens) || 0,
          cost: typeof row.costUSD === "number" ? row.costUSD : null
        };
        const models = (Array.isArray(row.models) ? row.models : []).filter((model) => model && typeof model.model === "string");
        if (!models.length) {
          entries.push(Object.assign({}, base, { model: "", costKnown: base.cost !== null }));
          return;
        }
        let known = { input: 0, output: 0, cacheRead: 0, cacheWrite: 0, total: 0, cost: 0 };
        let costComplete = true;
        models.forEach((model) => {
          const cost = typeof model.costUSD === "number" ? model.costUSD : null;
          if (cost === null) costComplete = false;
          entries.push({
            date: row.date,
            source: source.source,
            model: model.model,
            input: Number(model.inputTokens) || 0,
            output: Number(model.outputTokens) || 0,
            cacheRead: Number(model.cacheReadTokens) || 0,
            cacheWrite: Number(model.cacheCreationTokens) || 0,
            total: Number(model.totalTokens) || 0,
            cost: cost,
            costKnown: cost !== null
          });
          known.input += Number(model.inputTokens) || 0;
          known.output += Number(model.outputTokens) || 0;
          known.cacheRead += Number(model.cacheReadTokens) || 0;
          known.cacheWrite += Number(model.cacheCreationTokens) || 0;
          known.total += Number(model.totalTokens) || 0;
          if (cost !== null) known.cost += cost;
        });
        const remainder = {
          input: Math.max(0, base.input - known.input),
          output: Math.max(0, base.output - known.output),
          cacheRead: Math.max(0, base.cacheRead - known.cacheRead),
          cacheWrite: Math.max(0, base.cacheWrite - known.cacheWrite),
          total: Math.max(0, base.total - known.total)
        };
        const costRemainder = costComplete && base.cost !== null ? Math.max(0, base.cost - known.cost) : null;
        if (remainder.total > 0 || remainder.input || remainder.output || remainder.cacheRead || remainder.cacheWrite || (costRemainder || 0) > 1e-9) {
          entries.push({
            date: row.date, source: source.source, model: "",
            input: remainder.input, output: remainder.output, cacheRead: remainder.cacheRead,
            cacheWrite: remainder.cacheWrite, total: remainder.total,
            cost: costRemainder, costKnown: costRemainder !== null
          });
        }
      });
    });
    return entries;
  }

  function modelSelected(model) {
    if (!state.modelsTouched) return true;
    return state.models.has(model);
  }

  function filteredEntries() {
    return buildEntries().filter((entry) => entry.model === "" || modelSelected(entry.model));
  }

  function entriesTotals(entries) {
    return entries.reduce((acc, entry) => {
      acc.input += entry.input;
      acc.output += entry.output;
      acc.cacheRead += entry.cacheRead;
      acc.cacheWrite += entry.cacheWrite;
      acc.total += entry.total;
      if (entry.cost !== null) { acc.cost += entry.cost; acc.costRows += 1; } else { acc.costUnknown += 1; }
      return acc;
    }, { input: 0, output: 0, cacheRead: 0, cacheWrite: 0, total: 0, cost: 0, costRows: 0, costUnknown: 0 });
  }

  // Whether any selected source holds rows at all, ignoring the date filter.
  function hasAnyData() {
    const wanted = new Set(selectedSources());
    return state.report.sources.some((source) =>
      wanted.has(source.source) && (Array.isArray(source.daily) ? source.daily : [])
        .some((row) => row && typeof row.date === "string")
    );
  }

  function dayRows() {
    const wanted = new Set(selectedSources());
    const rows = [];
    state.report.sources.forEach((source) => {
      if (!wanted.has(source.source)) return;
      (Array.isArray(source.daily) ? source.daily : []).forEach((row) => {
        if (row && typeof row.date === "string" && dateInRange(row.date)) rows.push(row);
      });
    });
    return rows;
  }

  function renderSummary(entries) {
    const totals = entriesTotals(entries);
    const allModelSelected = !state.modelsTouched || Array.from(state.models).length >= collectModels().length;
    const rowCost = dayRows().reduce((sum, row) => sum + (Number(row.costUSD) || 0), 0);
    const costValue = allModelSelected ? rowCost : (totals.costUnknown ? null : totals.cost);
    const other = Math.max(0, totals.total - totals.input - totals.output - totals.cacheRead - totals.cacheWrite);
    const exactSub = (value) => (value >= 1000 ? formatExact(value) : "");
    const cards = [
      ["summaryTokens", formatTokens(totals.total), "var(--accent)", other ? t("summaryOther") + ": " + formatTokens(other) : exactSub(totals.total)],
      ["summaryInput", formatTokens(totals.input), "var(--c1)", exactSub(totals.input)],
      ["summaryOutput", formatTokens(totals.output), "var(--c2)", exactSub(totals.output)],
      ["summaryCacheRead", formatTokens(totals.cacheRead), "var(--c3)", exactSub(totals.cacheRead)],
      ["summaryCacheWrite", formatTokens(totals.cacheWrite), "var(--c4)", exactSub(totals.cacheWrite)],
      ["summaryCost", formatCost(costValue), "var(--c6)", allModelSelected ? "" : t("model")]
    ];
    el("summary").innerHTML = cards.map(([key, value, color, sub]) =>
      '<div class="card stat" style="--stat-color:' + color + '"><div class="label"><span class="dot" style="background:' + color + '"></span>' +
      esc(t(key)) + '</div><div class="value">' + esc(value) + '</div>' +
      (sub ? '<div class="sub">' + esc(sub) + "</div>" : "") + "</div>"
    ).join("");
  }

  function sourceCounts() {
    const counts = {};
    buildEntries().forEach((entry) => {
      if (!entry.model) return;
      counts[entry.source] = (counts[entry.source] || 0) + entry.total;
    });
    return counts;
  }

  function renderSourceFilter() {
    const host = el("source-filter");
    const statuses = sourceStatus();
    const listed = Object.keys(statuses).length ? Object.keys(statuses) : SOURCES;
    const counts = sourceCounts();
    host.innerHTML = "";
    listed.forEach((source) => {
      const status = statuses[source];
      const label = document.createElement("label");
      label.className = "chip";
      const input = document.createElement("input");
      input.type = "checkbox";
      input.checked = state.sources.has(source);
      input.value = source;
      input.disabled = status && status.status === "error";
      input.addEventListener("change", () => {
        state.sourcesTouched = true;
        if (input.checked) state.sources.add(source); else state.sources.delete(source);
        render();
      });
      const span = document.createElement("span");
      const dot = document.createElement("i");
      dot.className = "dot";
      dot.style.background = SOURCE_COLORS[source] || "var(--muted)";
      span.appendChild(dot);
      span.appendChild(document.createTextNode(sourceLabel(source)));
      if (status && status.status === "error") {
        const flag = document.createElement("em");
        flag.className = "mono";
        flag.style.color = "var(--error)";
        flag.style.fontStyle = "normal";
        flag.textContent = " · " + t("sourceFailed");
        span.appendChild(flag);
      } else if (status && status.status === "empty") {
        const flag = document.createElement("em");
        flag.className = "mono";
        flag.style.color = "var(--muted)";
        flag.style.fontStyle = "normal";
        flag.textContent = " · " + t("sourceEmpty");
        span.appendChild(flag);
      } else if (counts[source]) {
        const count = document.createElement("span");
        count.className = "count";
        count.textContent = formatTokens(counts[source]);
        span.appendChild(count);
      }
      label.appendChild(input);
      label.appendChild(span);
      host.appendChild(label);
    });
  }

  function renderRangePresets() {
    const host = el("range-presets");
    host.innerHTML = "";
    [["7", "range7"], ["30", "range30"], ["90", "range90"], ["all", "rangeAll"]].forEach(([value, key]) => {
      const label = document.createElement("label");
      label.className = "chip";
      const input = document.createElement("input");
      input.type = "radio";
      input.name = "range";
      input.value = value;
      input.checked = state.range === value;
      input.addEventListener("change", () => setPreset(value));
      const span = document.createElement("span");
      span.textContent = t(key);
      label.appendChild(input);
      label.appendChild(span);
      host.appendChild(label);
    });
  }

  function renderStatus() {
    const notice = el("status-notice");
    if (!state.report) { notice.hidden = true; return; }
    const statuses = sourceStatus();
    const failures = Object.keys(statuses).filter((key) => statuses[key].status === "error");
    if (!failures.length) {
      notice.hidden = true;
      notice.innerHTML = "";
      return;
    }
    notice.hidden = false;
    notice.dataset.kind = "warning";
    notice.innerHTML = '<div class="message"><strong>' + esc(t("partialTitle")) + "</strong>" +
      failures.map((key) => '<div class="detail">' + esc(sourceLabel(key)) + " · " + esc(errorLabel(statuses[key].error)) + "</div>").join("") +
      '</div><button class="btn" type="button" id="retry">' + esc(t("retry")) + "</button>";
    const retry = el("retry");
    if (retry) retry.addEventListener("click", () => load(true));
  }

  const UNATTRIBUTED = "\u0000unattributed";

  function aggregateBy(entries, key) {
    const groups = new Map();
    entries.forEach((entry) => {
      const name = key === "model" ? (entry.model || UNATTRIBUTED) : entry.source;
      const current = groups.get(name) || { name, total: 0, input: 0, output: 0, cacheRead: 0, cacheWrite: 0 };
      current.total += entry.total;
      current.input += entry.input;
      current.output += entry.output;
      current.cacheRead += entry.cacheRead;
      current.cacheWrite += entry.cacheWrite;
      groups.set(name, current);
    });
    return groups;
  }

  function renderChart(entries) {
    const svg = el("chart");
    const scroll = el("chart-scroll");
    const legend = el("legend");
    const byDate = new Map();
    const groupTotals = new Map();
    entries.forEach((entry) => {
      const name = state.group === "model" ? (entry.model || t("unattributed")) : entry.source;
      const day = byDate.get(entry.date) || { date: entry.date, groups: new Map(), total: 0 };
      byDate.set(entry.date, day);
      const current = day.groups.get(name) || { input: 0, output: 0, cacheRead: 0, cacheWrite: 0, total: 0 };
      current.input += entry.input;
      current.output += entry.output;
      current.cacheRead += entry.cacheRead;
      current.cacheWrite += entry.cacheWrite;
      current.total += entry.total;
      day.groups.set(name, current);
      day.total += entry.total;
      groupTotals.set(name, (groupTotals.get(name) || 0) + entry.total);
    });
    const ranked = Array.from(groupTotals.entries()).sort((a, b) => b[1] - a[1]);
    const visible = ranked.slice(0, 6).map(([name]) => name);
    const hidden = ranked.length > 6;
    const colorFor = (name) => {
      const index = visible.indexOf(name);
      return index >= 0 ? PALETTE[index % PALETTE.length] : "var(--muted)";
    };
    const labelFor = (name) => (state.group === "source" ? sourceLabel(name) : name);

    legend.innerHTML = visible.map((name) =>
      '<span><i class="dot" style="background:' + colorFor(name) + '"></i>' + esc(labelFor(name)) + "</span>"
    ).join("") + (hidden ? '<span><i class="dot" style="background:var(--muted)"></i>' + esc(t("other")) + "</span>" : "");
    el("chart-title").textContent = t("trendTitle");
    svg.setAttribute("aria-label", t("trendTitle"));

    const days = Array.from(byDate.values()).sort((a, b) => a.date.localeCompare(b.date));
    if (!days.length) {
      svg.innerHTML = "";
      svg.setAttribute("viewBox", "0 0 320 120");
      svg.setAttribute("height", "120");
      svg.setAttribute("width", "320");
      svg.style.minWidth = "";
      return;
    }
    const barSlot = 28;
    const width = Math.max(scroll.clientWidth || 320, days.length * barSlot + 48);
    const height = 270;
    const padTop = 14, padBottom = 30, padLeft = 50, padRight = 12;
    const plotW = width - padLeft - padRight;
    const plotH = height - padTop - padBottom;
    const maxTotal = Math.max.apply(null, days.map((day) => Math.max(day.total, 1)));
    const niceMax = nicestMax(maxTotal);
    let out = "";
    for (let step = 0; step <= 4; step += 1) {
      const value = (niceMax / 4) * step;
      const y = padTop + plotH - (plotH * step) / 4;
      out += '<line x1="' + padLeft + '" x2="' + (width - padRight) + '" y1="' + y + '" y2="' + y + '" style="stroke:var(--border);stroke-width:1"/>';
      out += '<text x="' + (padLeft - 8) + '" y="' + (y + 4) + '" text-anchor="end" style="fill:var(--muted);font-size:11px">' + esc(formatTokens(value)) + "</text>";
    }
    const labelStep = Math.max(1, Math.ceil(days.length / Math.max(1, Math.floor(plotW / 64))));
    days.forEach((day, index) => {
      const slot = plotW / days.length;
      const barW = Math.max(6, Math.min(22, slot * 0.62));
      const x = padLeft + slot * index + (slot - barW) / 2;
      const ordered = Array.from(day.groups.entries()).sort((a, b) => {
        const aIndex = visible.indexOf(a[0]);
        const bIndex = visible.indexOf(b[0]);
        return (aIndex < 0 ? 99 : aIndex) - (bIndex < 0 ? 99 : bIndex);
      });
      let y = padTop + plotH;
      const tooltip = day.date + " · " + t("summaryTokens") + " " + formatTokens(day.total);
      out += '<g><title>' + esc(tooltip) + "</title>";
      ordered.forEach(([name, value]) => {
        if (!value.total) return;
        const h = (value.total / niceMax) * plotH;
        y -= h;
        out += '<rect x="' + x + '" y="' + y + '" width="' + barW + '" height="' + h + '" rx="2" style="fill:' + colorFor(name) + '"/>';
      });
      out += "</g>";
      if (index % labelStep === 0) {
        out += '<text x="' + (x + barW / 2) + '" y="' + (height - 10) + '" text-anchor="middle" style="fill:var(--muted);font-size:11px">' + esc(day.date.slice(5)) + "</text>";
      }
    });
    svg.setAttribute("viewBox", "0 0 " + width + " " + height);
    svg.setAttribute("height", height);
    svg.setAttribute("width", width);
    svg.style.minWidth = width + "px";
    svg.innerHTML = out;
  }

  function nicestMax(value) {
    const exponent = Math.pow(10, Math.floor(Math.log10(value || 1)));
    const fraction = value / exponent;
    const steps = [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10];
    return (steps.find((step) => fraction <= step) || 10) * exponent;
  }

  // Model ranking doubles as the model filter. Aggregates ignore the model
  // selection so deselected models stay visible and can be re-enabled.
  function renderModels() {
    const host = el("model-list");
    const entries = buildEntries();
    const groups = aggregateBy(entries, "model");
    const sourcesFor = {};
    entries.forEach((entry) => {
      if (!entry.model) return;
      (sourcesFor[entry.model] = sourcesFor[entry.model] || new Set()).add(entry.source);
    });
    const costFor = {};
    const knownFor = {};
    entries.forEach((entry) => {
      if (!entry.model) return;
      if (entry.cost !== null) {
        costFor[entry.model] = (costFor[entry.model] || 0) + entry.cost;
        knownFor[entry.model] = (knownFor[entry.model] || 0) + entry.total;
      }
    });
    const rows = Array.from(groups.values()).filter((row) => row.name !== UNATTRIBUTED)
      .sort((a, b) => b.total - a.total);
    const total = rows.reduce((sum, row) => sum + row.total, 0);
    const all = collectModels();
    el("model-meta").textContent = rows.length ? t("modelMeta", { n: rows.length }) : "";
    if (!rows.length) {
      host.innerHTML = '<div class="empty" style="padding:24px 8px">' + esc(t("modelEmpty")) + "</div>";
      return;
    }
    const noneSelected = state.modelsTouched && !rows.some((row) => state.models.has(row.name));
    let html = (noneSelected
      ? '<div class="notice" data-kind="info" style="margin:0 0 10px;padding:9px 12px"><div class="message">' + esc(t("modelsNoneSelected")) + "</div></div>"
      : "") + '<div class="model-row head" aria-hidden="true"><span></span><span>' + esc(t("model")) +
      "</span><span>" + esc(t("share")) + "</span><span class='num'>" + esc(t("summaryTokens")) +
      "</span><span class='num'>" + esc(t("summaryCost")) + "</span></div>";
    rows.forEach((row) => {
      const share = total > 0 ? (row.total / total) * 100 : 0;
      const sources = Array.from(sourcesFor[row.name] || []).map(sourceLabel).join(", ");
      const cost = knownFor[row.name] ? costFor[row.name] : null;
      const checked = state.models.has(row.name) || !state.modelsTouched;
      html += '<label class="model-row">' +
        '<input class="rank-check" type="checkbox" value="' + esc(row.name) + '"' + (checked ? " checked" : "") + ">" +
        '<span class="model-name" title="' + esc(row.name + (sources ? " · " + sources : "")) + '">' + esc(row.name) +
        '<span class="src">' + esc(sources) + "</span></span>" +
        '<span class="share"><i style="width:' + Math.max(2, share).toFixed(1) + '%"></i></span>' +
        '<span class="num">' + esc(formatTokens(row.total)) + "</span>" +
        '<span class="num' + (cost === null ? " muted" : "") + '">' + esc(formatCost(cost)) + "</span>" +
        "</label>";
    });
    host.innerHTML = html;
    host.querySelectorAll(".rank-check").forEach((input) => {
      input.addEventListener("change", () => {
        state.modelsTouched = true;
        if (input.checked) state.models.add(input.value); else state.models.delete(input.value);
        render();
      });
    });
  }

  function renderTable(entries) {
    const body = el("rows");
    const totalRow = el("rows-total");
    const rows = entries.slice().sort((a, b) =>
      b.date.localeCompare(a.date) || String(a.source).localeCompare(b.source) ||
      String(a.model).localeCompare(b.model) || b.total - a.total
    );
    const shown = rows.slice(0, TABLE_LIMIT);
    body.innerHTML = "";
    shown.forEach((row) => {
      const tr = document.createElement("tr");
      const cells = [
        row.date,
        null,
        row.model || t("unattributed"),
        formatTokens(row.input),
        formatTokens(row.output),
        formatTokens(row.cacheRead),
        formatTokens(row.cacheWrite),
        formatTokens(row.total),
        formatCost(row.cost)
      ];
      cells.forEach((value, index) => {
        const td = document.createElement("td");
        if (index === 1) {
          td.innerHTML = '<span class="badge"><i class="dot" style="background:' + (SOURCE_COLORS[row.source] || "var(--muted)") + '"></i><span class="name">' + esc(sourceLabel(row.source)) + "</span></span>";
        } else if (index === 0) {
          td.textContent = value;
          td.className = "mono";
        } else {
          td.textContent = value;
          if (index === 8 && row.cost === null) td.className = "muted";
        }
        tr.appendChild(td);
      });
      body.appendChild(tr);
    });
    const totals = entriesTotals(entries);
    const allModelSelected = !state.modelsTouched || Array.from(state.models).length >= collectModels().length;
    const cost = allModelSelected ? dayRows().reduce((sum, row) => sum + (Number(row.costUSD) || 0), 0) : (totals.costUnknown ? null : totals.cost);
    let footer = "";
    if (entries.length) {
      footer = "<tr><td>" + esc(t("total")) + "</td><td></td><td></td><td>" + esc(formatTokens(totals.input)) +
        "</td><td>" + esc(formatTokens(totals.output)) + "</td><td>" + esc(formatTokens(totals.cacheRead)) +
        "</td><td>" + esc(formatTokens(totals.cacheWrite)) + "</td><td>" + esc(formatTokens(totals.total)) +
        "</td><td>" + esc(formatCost(cost)) + "</td></tr>";
      if (rows.length > TABLE_LIMIT) {
        footer += '<tr><td colspan="9" class="footnote">' + esc(t("rowsCapped", { n: TABLE_LIMIT })) + "</td></tr>";
      }
    }
    totalRow.innerHTML = footer;
  }

  function render() {
    if (!state.report) return;
    reconcileSelection();
    // A preset window can miss older history entirely (for example after a
    // long break). Widen to "all" once, on the first snapshot only: a later
    // custom range chosen by the user is never overridden.
    if (state.pendingAutoRange) {
      state.pendingAutoRange = false;
      if (state.range !== "all" && !filteredEntries().length && hasAnyData()) {
        state.range = "all";
        state.from = "";
        state.to = "";
        el("date-from").value = "";
        el("date-to").value = "";
        renderRangePresets();
      }
    }
    const baseEntries = buildEntries();
    const entries = filteredEntries();
    const statuses = sourceStatus();
    const failed = Object.keys(statuses).filter((key) => statuses[key].status === "error");
    el("loading").hidden = true;
    el("content").hidden = false;
    el("empty-state").hidden = entries.length > 0 || failed.length > 0 || baseEntries.length > 0;
    el("content").querySelectorAll(".summary-grid, .panel").forEach((node) => {
      // The model panel is also the model filter: hiding it when every model is
      // deselected would make the selection impossible to restore.
      const keep = node.id === "model-panel" && baseEntries.length > 0;
      node.style.display = entries.length || keep ? "" : "none";
    });
    renderStatus();
    renderSourceFilter();
    renderSummary(entries);
    renderChart(entries);
    renderModels();
    renderTable(entries);
    document.querySelectorAll("#group-by button").forEach((button) => {
      button.setAttribute("aria-pressed", String(button.dataset.group === state.group));
    });
    const generated = state.report.generatedAt ? new Date(state.report.generatedAt) : null;
    el("generated").textContent = generated && !isNaN(generated)
      ? t("generated") + " " + generated.toLocaleString(state.language)
      : "";
    el("top-actions").hidden = false;
    el("refresh").disabled = state.loading;
  }

  function showLoading(quiet) {
    state.loading = true;
    if (quiet) return; // background refreshes must not touch the DOM
    el("refresh").disabled = true;
    el("loading").hidden = false;
    el("content").hidden = true;
    el("empty-state").hidden = true;
    const status = el("status-notice");
    status.hidden = false;
    status.dataset.kind = "info";
    status.innerHTML = '<span class="spinner" aria-hidden="true"></span><div class="message">' + esc(t("loading")) + "</div>";
  }

  function showLoadError() {
    state.loading = false;
    el("loading").hidden = true;
    const notice = el("status-notice");
    notice.hidden = false;
    notice.dataset.kind = "error";
    notice.innerHTML = '<div class="message">' + esc(t("loadError")) + '</div><button class="btn" type="button" id="retry">' + esc(t("retry")) + "</button>";
    const retry = el("retry");
    if (retry) retry.addEventListener("click", () => load(true));
    el("refresh").disabled = false;
  }

  async function load(force, quiet) {
    if (!state.key || state.loading) return;
    if (!quiet) {
      el("auth-error").hidden = true;
      el("auth-form").hidden = true;
      el("dashboard").hidden = false;
    }
    showLoading(quiet);
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 90000);
    try {
      const url = DATA_PATH + (force ? "?refresh=1" : "");
      const response = await fetch(url, {
        method: "GET",
        headers: { Authorization: "Bearer " + state.key },
        cache: "no-store",
        credentials: "omit",
        signal: controller.signal
      });
      if (response.status === 401 || response.status === 403) {
        state.key = "";
        stopAuto();
        el("dashboard").hidden = true;
        el("top-actions").hidden = true;
        el("auth-form").hidden = false;
        el("auth-error").hidden = false;
        el("auth-error").textContent = t("authFailed");
        return;
      }
      if (!response.ok) throw new Error("request failed");
      const data = await response.json();
      if (!data || !Array.isArray(data.sources)) throw new Error("invalid payload");
      const previous = state.report;
      state.report = data;
      if (!previous) state.pendingAutoRange = true;
      state.loading = false;
      // A quiet refresh with an unchanged snapshot must not rebuild the DOM:
      // re-rendering churns layout and CPU for identical pixels.
      if (!(quiet && previous && previous.generatedAt === data.generatedAt)) render();
    } catch (error) {
      state.loading = false;
      if (state.report) render();
      showLoadError();
    } finally {
      clearTimeout(timer);
      state.loading = false;
      if (!quiet) el("refresh").disabled = false;
    }
  }

  // Auto refresh never forces a scan and pauses while the tab is hidden, so a
  // background page cannot keep waking the collector or the CPU.
  function scheduleAuto() {
    clearTimeout(state.timer);
    const seconds = Number(state.auto);
    if (!seconds) return;
    state.timer = setTimeout(async () => {
      if (!document.hidden && state.key) await load(false, true);
      scheduleAuto();
    }, seconds * 1000);
  }

  function startAuto(seconds) {
    state.auto = String(seconds);
    el("auto-refresh").value = state.auto;
    scheduleAuto();
  }

  function stopAuto() {
    clearTimeout(state.timer);
    state.timer = 0;
    state.auto = "0";
    el("auto-refresh").value = "0";
  }

  function wire() {
    el("auth-controls").addEventListener("submit", (event) => {
      event.preventDefault();
      const input = el("management-key");
      const value = input.value.trim();
      input.value = "";
      if (!value) return;
      state.key = value;
      load(false);
    });
    el("refresh").addEventListener("click", () => load(true));
    el("auto-refresh").addEventListener("change", (event) => startAuto(event.target.value));
    el("sources-all").addEventListener("click", () => {
      state.sourcesTouched = true;
      Object.keys(sourceStatus()).forEach((source) => state.sources.add(source));
      render();
    });
    el("sources-none").addEventListener("click", () => {
      state.sourcesTouched = true;
      state.sources = new Set();
      render();
    });
    document.querySelectorAll("#group-by button").forEach((button) => {
      button.addEventListener("click", () => {
        state.group = button.dataset.group;
        if (state.report) render();
      });
    });
    el("date-from").addEventListener("change", (event) => {
      state.from = event.target.value;
      state.range = "custom";
      renderRangePresets();
      render();
    });
    el("date-to").addEventListener("change", (event) => {
      state.to = event.target.value;
      state.range = "custom";
      renderRangePresets();
      render();
    });
    const media = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
    if (media && media.addEventListener) {
      media.addEventListener("change", () => { if (!document.documentElement.hasAttribute("data-theme")) applyTheme(); });
    }
    let resizeTimer = 0;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => { if (state.report) renderChart(filteredEntries()); }, 120);
    });
    window.addEventListener("storage", (event) => {
      if (event.key === STORAGE_LANGUAGE || event.key === STORAGE_THEME) {
        applyTheme();
        applyLanguage();
        if (state.report) render();
      }
    });
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && state.auto !== "0" && state.key && !state.loading) load(false, true);
    });
  }

  applyTheme();
  applyLanguage();
  wire();
  setPreset("30");

  const saved = readSavedKey();
  if (saved) {
    state.key = saved;
    load(false);
  } else {
    el("management-key").focus();
  }
})();
</script>
</body>
</html>
